iy tarkibning hayoti va sogʻligini saqlash, harbiy qismning moʻljallanishi boʻyicha jangovar vazifalarni bajarish uchun qulay sharoitlar yaratish.", "harbiy shaharcha va obyektlar yon-atroflarida uzluksiz vizual razvedka olib borish, harbiy qismning jangovar xizmat faoliyatini razvedka qilinishiga yoʻl qoʻymaslik; begona shaxslarni harbiy shaharcha va obyektlarga kirishini oldini olish; harbiy shaharcha va obyektlarga boʻlgan qurolli hujumni qaytarish."], "c": 1}, {"n": 77, "q": "Qurollangan tezkor harakatlanuvchi boʻlinma tarkibida oʻq-otar qurollar uchun quyidagi hisobda oʻq-dorilar boʻlishi kerak.", "o": ["AK-74 avtomatlari va uning modifikatsiyalari uchun – 120 ta oʻq, RPK (RPKS) pulemyotlari uchun – 180 ta oʻq, PK (PKM) pulemyotlari uchun – 250 ta oʻq va SVD (VSK-94) snayper miltiqlari uchun – 40 ta oʻq.", "AK-74 avtomatlari va uning modifikatsiyalari uchun – 60 ta oʻq, RPK (RPKS) pulemyotlari uchun – 90 ta oʻq, PK (PKM) pulemyotlari uchun – 125 ta oʻq va SVD (VSK- 94) snayper miltiqlari uchun – 20 ta oʻq.", "AK-74 avtomatlari va uning modifikatsiyalari uchun – 90 ta oʻq, RPK (RPKS) pulemyotlari uchun – 125 ta oʻq, PK (PKM) pulemyotlari uchun – 250 ta oʻq va SVD (VSK-94) snayper miltiqlari uchun – 30 ta oʻq.", "AK-74 avtomatlari va uning modifikatsiyalari uchun – 120 ta oʻq, RPK (RPKS) pulemyotlari uchun – 200 ta oʻq, PK (PKM) pulemyotlari uchun – 200 ta oʻq va SVD (VSK-94) snayper miltiqlari uchun – 40 ta oʻq."], "c": 0}, {"n": 78, "q": "Harbiy shaharchalarni qoʻriqlash va mudofaa qilishda qaysi obyektlar asosiy qoʻriqlash obyektlari hisoblanadi", "o": ["qo‘mondonlik, shaxsiy tarkib, aloqa tugunlari va vositalari, qurol-aslaha, oʻq-dori, yoqilgʻi moylash materiallari omborxonalari (bazalar).", "shaxsiy tarkib, boshqaruv punktlari, aloqa tugunlari va vositalari, qurol-aslaha, oʻq-dori, yoqilgʻi moylash materiallari va boshqa harbiy texnika vositalari omborxonalari (bazalar).", "boshqarma, bo‘linmalar, boshqaruv punktlari, qurol-aslaha, oʻq-dori, yoqilgʻi moylash materiallari va boshqa harbiy texnika vositalari omborxonalari (bazalar).", "qo‘mondonlik, bo‘linmalar, aloqa tugunlari va vositalari, yoqilgʻi moylash materiallari va boshqa harbiy texnika vositalari omborxonalari (bazalar)."], "c": 1}, {"n": 79, "q": "Soqchining xizmatini tekshiradigan shaxsga qorovul boshlig‘i yoki uning yordamchisi necha nafar qurollangan qorovul bilan hamroxlik qiladi.", "o": ["1 nafar qurollangan qorovul bilan.", "2 nafar qurollangan qorovul bilan.", "qorovul boshlig‘i yoki uning yordamchisi bilan.", "3 nafar qurollangan qorovul bilan."], "c": 1}, {"n": 80, "q": "Garnizon naryadlari tarkibini ko‘rsating?", "o": ["Garnizon bo‘yicha navbatchi, garnizon qorovullari, garnizon patrullari, XAN inspektorlari, garnizon bo‘yicha navbatchi tez tibbiy yordam mashinasi.", "Garnizon qorovullari, garnizon patrullari, garnizon bo‘yicha navbatchi, garnizon navbatchi bo‘linmasi, garnizon bo‘yicha navbatchi mashina, garnizon XAN bo‘yicha javobgar shaxs.", "Garnizon bo‘yicha mansabdor shaxs, garnizon bo‘yicha navbatchi, garnizon bo‘yicha navbatchi yordamchisi,  garnizon qorovullari, garnizon navbatchi bo‘linmasi, garnizon patrullari.", "Garnizon bo‘yicha mansabdor shaxs, garnizon qorovullari, garnizon patrullari, garnizon bo‘yicha navbatchi,  garnizon bo‘yicha navbatchi yordamchisi, garnizon bo‘yicha o‘t o‘chirish mashinasi."], "c": 2}, {"n": 81, "q": "Har oyda garnizon naryadlari qaydnomasi kimlar ishtirokida tuziladi?", "o": ["Garnizon harbiy komendanti, garnizon harbiy komendanti o‘rinbosari va katta yordamchilari ishtirokida.", "Garnizon mansabdor shaxslari va garnizon harbiy komendanti ishtirokida.", "Garnizon harbiy komendanti o‘rinbosari va katta yordamchilari ishtirokida.", "Garnizon mansabdor shaxslari va harbiy qism (muassasa) shtabi boshiqlari ishtirokida."], "c": 3}, {"n": 82, "q": "Texnik qo‘riqlash vositalari operatorlari va NO‘P naryadlari tomonidan kuzatuv natijalarini qayd qilish jurnaliga kuzatuv natijalari necha soatda (yozilib) yuritilib boriladi.", "o": ["har 2 soatda", "har 4 soatda", "har 6 soatda", "har 8 soatda"], "c": 0}, {"n": 83, "q": "Harbiy shaharcha va obyektlar joylashgan joylashuvidan kelib chiqib, shahar chegarasida va shahar chegarasidan tashqarida joylashgan harbiy shaharcha va obyektlar orasidagi cheklov zonasi qancha masofada bo‘ladi.", "o": ["shahar chegarasida joylashgan bo‘lsa necha 10 metrdan kam bo‘lmagan, shahar chegarasidan tashqarida joylashgan bo‘lsa necha 60 metrdan kam bo‘lmagan.", "shahar chegarasida joylashgan bo‘lsa necha 8 metrdan kam bo‘lmagan, shahar chegarasidan tashqarida joylashgan bo‘lsa necha 80 metrdan kam bo‘lmagan.", "shahar chegarasida joylashgan bo‘lsa necha 8 metrdan kam bo‘lmagan, shahar chegarasidan tashqarida joylashgan bo‘lsa necha 80 metrdan kam bo‘lmagan.", "shahar chegarasida joylashgan bo‘lsa 6 metrdan kam bo‘lmagan, shahar chegarasidan tashqarida joylashgan bo‘lsa 50 metrdan kam bo‘lmagan."], "c": 3}, {"n": 84, "q": "Nazorat-o‘tkazish punktlari tashqi tomonida o‘rnatiladigan O‘zbekiston Davlat va Mudofaa vazirligi bayroqlari necha metr balandlikda o‘rnatiladi?", "o": ["10 metr.", "8 metr.", "12 metr.", "15 metr."], "c": 1}, {"n": 85, "q": "Ichki qorovulxanalarda saqlanadigan zahira o‘q-dorilari va granatalarning mavjudligi va holati kim tomonidan va qancha muddatda tekshiriladi?", "o": ["Har oyda kamida 1 marta – shtab boshlig‘i tomonidan.", "Har oyda 1 marta – shtab boshlig‘i va 1 marta shtab boshlig‘ining harbiy xizmat xavfsizligini ta’minlash bo‘yicha o‘rinbosari tomonidan.", "Har chorakda kamida 1 marta – shtab boshlig‘i va har oyda 1 marta shtab boshlig‘ining harbiy xizmat xavfsizligini ta’minlash bo‘yicha o‘rinbosari tomonidan.", "Har chorakda kamida 1 marta – shtab boshlig‘i tomonidan."], "c": 0}, {"n": 86, "q": "Qorovullik xizmatida qo‘riqchi itlardan nima maqsadda foydalaniladi?", "o": ["Soqchilar sonini kamaytirish maqsadida.", "Soqchi xizmat o‘tash postnini kattaligi uchun.", "Obyektni qo‘riqlanishini kuchaytirish maqsadida kechasi, ko‘rish qiyin bo‘lgan sharoitlarda va nam ob-havoda.", "Barcha javoblar noto‘g‘ri."], "c": 2}, {"n": 87, "q": "Itlarining postda turishi bir sutkada necha soatdan oshmasligi kerak?", "o": ["12 soatdan.", "6 soatdan.", "8 soatdan.", "4 soatdan."], "c": 0}, {"n": 88, "q": "Harbiy qism (muassasa)ning kun tartibi va kontrakt bo‘yicha harbiy xizmatchilarning xizmat vaqti reglamenti kim tomonidan belgilanadi?", "o": ["Harbiy qism (muassasa) kadrlar bo‘limi tomonidan.", "Harbiy qism (muassasa) shtab boshlig‘i tomonidan.", "Harbiy qism (muassasa) komandirining (boshlig‘ining) jangovar tayyorgarlik bo‘yicha o‘rinbosari tomonidan.", "Harbiy qism (muassasa) komandiri (boshlig‘i) tomonidan."], "c": 3}, {"n": 89, "q": "Biriktirilgan hududlarda har kuni tozalik ishlari va ichki tartibni saqlash kim tomonidan amalga oshiriladi?", "o": ["Bo‘linmalardan ajratilgan shaxsiy tarkib tomonidan.", "Sutkalik naryadlar tomonidan.", "Sog‘ligi tufayli jismoniy tayyorgarlik mashg‘ulotlaridan ozod etilganlar tomonidan.", "Barcha javoblar noto‘g‘ri."], "c": 1}, {"n": 90, "q": "Harbiy qism (muassasa) larda ichki tekshiruv komissiyasi tomonidan TQV bo‘yicha inventarizatsiya tekshiruvi qancha muddatda o‘tkaziladi.", "o": ["1 yilda 1 marotaba yanvar oyida.", "1 yilda 1 marotaba fevral oyida.", "1 yilda 2 marotaba mart va noyabr oylarida.", "1 yilda 4 marotaba har chorakda."], "c": 1}, {"n": 91, "q": "Harbiy obyektlarni TQV bilan jihozlashda uning ahamiyatidan kelib chiqib, nechi darajali etib belgilangan.", "o": ["2 darajali.", "4 darajali.", "3 darajali.", "5 darajali."], "c": 2}, {"n": 92, "q": "Harbiy okrug hududida joylashgan harbiy qism (muassasa) larda shtatdan tashqari TQVga tayinlangan shaxsiy tarkib bilim va ko‘nikmalarini oshirish maqsadida 1 yilda harbiy okrug qo‘shinlar xizmati bo‘limi boshlig‘i rahbarligida necha marotaba nazariy va amaliy mashg‘ulotlar o‘tkaziladi.", "o": ["Har yili kamida bir marotaba.", "Har olti oyda kamida bir marotaba.", "Har chorakda kamida bir marotaba.", "Har oyda kamida bir marotaba."], "c": 0}, {"n": 93, "q": "Harbiy qism (muassasa) larda TQV bo‘yicha moddiy vositalar mavjudligi va harakati hisobini yuritish (27-shakl) kitobi kim tomonidan yuritiladi.", "o": ["Bo‘linma komandiri tomonidan.", "Vzvod serjantlari tomonidan.", "Shtab boshlig‘ining (komandirning) harbiy xizmat xavfsizligini ta’minlash bo‘yicha o‘rinbosari tomonidan.", "Aloqa bo‘limi boshlig‘i tomonidan."], "c": 2}, {"n": 94, "q": "Mudofaa vazirligi qo‘shinlarida TQV larni hisobdan chiqarish huquqi kimga yuklatilgan.", "o": ["Harbiy qism (muassasa) komandiri (boshlig‘i)ga.", "Okrug qo‘shinlar xizmati bo‘limi boshlig‘iga.", "Harbiy qism (muassasa) shtab boshlig‘iga.", "QK BSh qo‘shinlar xizmati bo‘limi boshlig‘iga."], "c": 3}, {"n": 95, "q": "Garnizon va qorovullik xizmatlariga jalb qilinmaydigan harbiy qismlar (muassasalar) ro‘yxati kim tomonidan belgilanadi.", "o": ["Garnizonda joylashgan harbiy qism komandiri va muassasa boshliqlari tomonidan o‘tkazilgan umumiy yig‘ilish bayonomasida belgilanadi.", "Garnizon boshlig‘i tomonidan.", "Garnizon harbiy komendanti tomonidan.", "O‘R QK Bosh Shtabi boshlig‘i tomonidan."], "c": 3}, {"n": 96, "q": "Qorovulxonadagi qurol saqlash javonidagi qurollarni qo‘riqlash kim tomonidan amalga oshiriladi.", "o": ["Sergak smenadan 1 nafar qorovul tayinlanadi.", "Qorovul boshlig‘i tomonidan qo‘riqlanadi.", "Qorovul boshlig‘i yordamchisi tomonidan qo‘riqlanadi.", "Tarqatuvchilar tomonidan qo‘riqlanadi."], "c": 0}, {"n": 97, "q": "Nazorat-o‘tkazish punktini qo‘riqlashda soqchi o‘z xizmatini o‘qdonni avtomatga qadagan holda qaysi vaqtlarda xizmat olib boradi.", "o": ["soat 19:00 dan kelgusi kunning 06:00 ga qadar.", "soat 19:00 dan kelgusi kunning 07:00 ga qadar.", "soat 18:00 dan kelgusi kunning 07:00 ga qadar.", "soat 18:00 dan kelgusi kunning 06:00 ga qadar."], "c": 0}, {"n": 98, "q": "Nazorat-o‘tkazish punktida qurol saqlash javoni kaliti kimda saqlanadi?", "o": ["Nazorat-o‘tkazish punkti bo‘yicha navbatchi yordamchilarida.", "Harbiy qism bo‘yicha tezkor navbatchida.", "Nazorat-o‘tkazish punkti bo‘yicha navbatchida.", "Barcha javoblar to‘g‘ri."], "c": 2}, {"n": 99, "q": "Qurollangan tezkor harakatlanuvchi boʻlinmaga qanday vazifalarni bajarish yuklatiladi?", "o": ["Harbiy shaharcha va obyektlar yon-atroflarida uzluksiz vizual razvedka olib borish, harbiy qismning jangovar xizmat faoliyatini razvedka qilinishiga yoʻl qoʻymaslik; begona shaxslarni harbiy shaharcha va obyektlarga kirishini oldini olish; harbiy shaharcha va obyektga hujum boʻlganda uni qaytarish, shaxsiy tarkibning hayoti va sogʻligini saqlash, harbiy qismning moʻljallanishi boʻyicha jangovar vazifalarni bajarish uchun qulay sharoitlar yaratish.", "Begona shaxslar tomonidan vizual razvedka olib borilishiga yoʻl qoʻymaslik; alohida shaxslarning harbiy shaharcha hududiga kirib kelishiga yoʻl qoʻymaslik; harbiy shaharchaga toʻsatdan hujumni amalga oshirilishiga yoʻl qoʻymaslik; harbiy shaharchaga boʻlgan qurolli hujumni qaytarish.", "Harbiy qism (muassasa) yon-atroflarida razvedka olib borish, jangovar xizmat faoliyatini razvedka qilinishiga yoʻl qoʻymaslik; Kichik guruhlar va yakka shaxslarni harbiy shaharcha hududiga kirishini oldini olish; harbiy shaharcha va obyektga hujum boʻlganda uni qaytarish; harbiy qismning moʻljallanishi boʻyicha jangovar vazifalarni bajarish uchun qulay sharoitlar yaratish.", "Begona shaxslar (dushman) tomonidan vizual razvedka olib borilishiga yoʻl qoʻymaslik; kichik guruhlar va alohida shaxslarning harbiy shaharcha va obyektlar hududiga noqonuniy kirib kelishiga yoʻl qoʻymaslik; harbiy shaharcha va obyektlarga toʻsatdan hujumni amalga oshirilishiga yoʻl qoʻymaslik, qurol-aslaha, harbiy texnikalarni qoʻlga kiritilishi va moddiy boyliklarni oʻgʻirlanishini oldini olish; harbiy shaharcha va obyektlarga boʻlgan qurolli hujumni qaytarish."], "c": 3}, {"n": 100, "q": "Nazorat-o‘tkazish punkti post qaydnomasi qaerda va qancha muddat saqlanadi?", "o": ["Besh yil davomida harbiy qism (muassasa) shtabida.", "Bir yil davomida harbiy qism (muassasa) shtabida.", "Ikki yil davomida harbiy qism (muassasa) shtabida.", "Uch yil davomida harbiy qism (muassasa) shtabida."], "c": 1}]}];

let selectedCount=20, selectedSection=0, questions=[], pos=0, score=0, answered=false;

const $=id=>document.getElementById(id);

document.querySelectorAll('#counts button').forEach(b=>{
  b.onclick=()=>{
    selectedCount=b.dataset.n;
    document.querySelectorAll('#counts button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  };
});
document.querySelector('#counts button[data-n="20"]').classList.add('on');

DATA.forEach((s,i)=>{
  const b=document.createElement('button');
  b.className='secondary';
  b.style.width='100%';
  b.style.textAlign='left';
  b.textContent=s.t+' — '+s.q.length+' ta savol';
  b.onclick=()=>{selectedSection=i;document.querySelectorAll('#sections button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};
  $('sections').appendChild(b);
});

function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function startQuiz(){
  const sec=DATA[selectedSection];
  questions=sec.q.slice();
  if(selectedCount!=='all') questions=questions.slice(0,Math.min(+selectedCount,questions.length));
  pos=0;score=0;answered=false;
  $('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');
  render();
}

function render(){
  const item=questions[pos];
  $('counter').textContent='SAVOL '+(pos+1)+' / '+questions.length;
  $('section').textContent=DATA[selectedSection].t;
  $('q').textContent=item.q;
  $('score').textContent=score;
  $('fill').style.width=((pos)/questions.length*100)+'%';
  $('opts').innerHTML='';
  $('next').disabled=true; answered=false;

  item.o.forEach((txt,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=String.fromCharCode(65+i)+') '+txt;
    b.onclick=()=>answer(b,i,item.c);
    $('opts').appendChild(b);
  });
}

function answer(btn,i,c){
  if(answered)return;
  answered=true;
  const bs=[...$('opts').children];
  bs.forEach(x=>x.disabled=true);
  if(i===c){btn.classList.add('correct');score++;}
  else{btn.classList.add('wrong');bs[c].classList.add('correct');}
  $('score').textContent=score;
  $('next').disabled=false;
}

$('next').onclick=()=>{
  if(pos<questions.length-1){pos++;render();}
  else showResult();
};
$('start').onclick=startQuiz;
$('exit').onclick=()=>{$('quiz').classList.add('hidden');$('home').classList.remove('hidden')};
$('again').onclick=startQuiz;
$('homeBtn').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden')};

function showResult(){
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
  const pct=Math.round(score/questions.length*100);
  $('pct').textContent=pct+'%';
  $('tally').textContent=score+' / '+questions.length+' ta to‘g‘ri javob';
}
</script>

<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Harbiy test</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#12150F;color:#E9EBDF;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%;}
.wrap{max-width:720px;margin:auto;padding:18px 14px 45px}
h1{font-size:22px;margin:0 0 6px} p{color:#9CA288;margin:0 0 18px;font-size:14px}
.panel{background:#1C2117;border:1px solid #3A4430;border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;-webkit-appearance:none;appearance:none;touch-action:manipulation;cursor:pointer}
.mainbtn{width:100%;padding:15px;border:0;border-radius:11px;background:#CDA64E;color:#171306;font-weight:800;font-size:16px}
.secondary{padding:10px 14px;border:1px solid #3A4430;border-radius:9px;background:#171B12;color:#E9EBDF}
.grid{display:grid;gap:9px}
.opt{width:100%;text-align:left;padding:14px;border:1px solid #3A4430;border-radius:11px;background:#222818;color:#E9EBDF}
.opt:active{transform:scale(.99)}
.opt.correct{background:rgba(134,192,106,.16);border-color:#86C06A}
.opt.wrong{background:rgba(220,111,97,.16);border-color:#DC6F61}
.small{font-size:12px;color:#9CA288}
.progress{height:6px;background:#3A4430;border-radius:99px;overflow:hidden;margin:10px 0 14px}
.fill{height:100%;background:#CDA64E;width:0}
.hidden{display:none!important}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{padding:9px 13px;border:1px solid #3A4430;border-radius:20px;background:#171B12;color:#9CA288}
.choice button.on{background:#CDA64E;color:#171306;border-color:#CDA64E;font-weight:700}
#q{font-size:18px;line-height:1.45;margin:4px 0 16px}
.result{text-align:center;padding:25px 10px}
.score{font-size:44px;font-weight:800;color:#CDA64E}
</style>
</head>
<body>
<div class="wrap">
<div id="home">
  <h1>HARBIY TAYYORGARLIK TESTLARI</h1>
  <p>iPhone uchun mustaqil ishlaydigan test. Internet kerak emas.</p>
  <div class="panel">
    <div class="small">SAVOLLAR SONI</div>
    <div class="choice" id="counts">
      <button data-n="10">10</button><button data-n="20">20</button>
      <button data-n="50">50</button><button data-n="all">Hammasi</button>
    </div>
    <br>
    <button class="mainbtn" id="start">BOSHLASH</button>
  </div>
  <div class="panel">
    <div class="small">BO‘LIMLAR</div>
    <div id="sections" class="grid"></div>
  </div>
</div>

<div id="quiz" class="hidden">
  <div class="row">
    <span class="small" id="counter"></span>
    <button class="secondary" id="exit">Chiqish</button>
  </div>
  <div class="progress"><div class="fill" id="fill"></div></div>
  <div class="panel">
    <div class="small" id="section"></div>
    <div id="q"></div>
    <div class="grid" id="opts"></div>
  </div>
  <div class="row">
    <span class="small">To‘g‘ri: <b id="score">0</b></span>
    <button class="secondary" id="next" disabled>Keyingi →</button>
  </div>
</div>

<div id="result" class="hidden panel result">
  <h2>NATIJA</h2>
  <div class="score" id="pct">0%</div>
  <p id="tally"></p>
  <button class="mainbtn" id="again">QAYTA ISHLASH</button><br><br>
  <button class="secondary" id="homeBtn">BOSH SAHIFA</button>
</div>
</div>

<script>
const DATA = [{"t": "Ma'naviy-ma'rifiy tayyorgarlik", "q": [{"n": 1, "q": "Neolit davrida Amudaryo va Sirdaryo oralig‘idagi aholining asosiy mashg‘uloti nimadan iborat bo‘lgan", "o": ["Baliq va hayvon ovchiligi.", "Dehqonchilik va ovchilik.", "Dehqonchilik va chorvachilik.", "Chorvachilik."], "c": 0}, {"n": 2, "q": "Markaziy Osiyo hududlarida qaysi davrga kelib ilk bor hayvonlarni xonaqilashtirish boshlandi?", "o": ["Mezolit davrining oxirlariga kelib, dastlabki uy chorvachiligi yoki hayvonlarni xonaqilashtirish boshlandi.", "Neolit davrining oxirlariga kelib, dastlabki uy chorvachiligi yoki hayvonlarni xonaqilashtirish boshlandi.", "Paleolit davrining oxirlariga kelib, dastlabki uy chorvachiligi yoki hayvonlarni xonaqilashtirish boshlandi.", "Eneolit davrining oxirlariga kelib, dastlabki uy chorvachiligi yoki hayvonlarni xonaqilashtirish boshlandi."], "c": 0}, {"n": 3, "q": "Qaysi davrga kelib ona Urug‘i tizimi (matriarxat)dan ota Urug‘i (patriarxat) tuzumi egallaydi?", "o": ["Bronza davriga kelib Ishlab chiqarishda hukmronlik qilish erkaklar qo‘liga o‘tadi va ona Urug‘i tuzumi o‘rnini ota Urug‘i (patriarxat) tuzumi egallaydi.", "Eneolit davriga kelib Ishlab chiqarishda hukmronlik qilish erkaklar qo‘liga o‘tadi va ona Urug‘i tuzumi o‘rnini ota Urug‘i (patriarxat) tuzumi egallaydi.", "Mezolit davriga kelib Ishlab chiqarishda hukmronlik qilish erkaklar qo‘liga o‘tadi va ona Urug‘i tuzumi o‘rnini ota Urug‘i (patriarxat) tuzumi egallaydi.", "Paleolit davriga kelib Ishlab chiqarishda hukmronlik qilish erkaklar qo‘liga o‘tadi va ona Urug‘i tuzumi o‘rnini ota Urug‘i (patriarxat) tuzumi egallaydi."], "c": 0}, {"n": 4, "q": "Saklar va massagetlar qaysi hududlarda yashaganligi tarixdan bizga ma’lum?", "o": ["Saklar va massagetlar O‘rta Osiyo va Qozog‘istonning tog‘lari, dashtlari va cho‘llarida yashagan.", "Saklar va massagetlar Kavkaz orti va Afg‘onistonnning tog‘lari, dashtlari va cho‘llarida yashagan.", "Saklar va massagetlar Xorazm va Eronning dashtlari va cho‘llarida yashagan.", "Saklar va massagetlar Turkiya va Iroqning tog‘lari, dashtlarida yashagan."], "c": 0}, {"n": 5, "q": "“Avesto”ga ko‘ra, jamiyatni idora qilishning qanday tizimi mavjud bo‘lgan?", "o": ["Oqsoqollar kengashi.", "Xalq yig‘ilishi.", "Mahalla yig‘ini.", "Jamoatchilik yig‘inlari."], "c": 0}, {"n": 6, "q": "Avestoning asosi va asoschisi kim?", "o": ["Zardushtiylik dinining payg‘ambari Zaroastr, ya’ni Zardushtdir.", "Zardushtiylik oqimini asoschisi Arastarar, ya’ni Arastudir.", "Zardushtiylik dining xudosi Otashparastiy, ya’ni Zardushtdir.", "Zardushtiylik yo‘nalishini rahbari Dovudiy, ya’ni Dovuddir."], "c": 0}, {"n": 7, "q": "Zardushtiylik ta’limoti nimalarni muqaddas deb hisoblagan?", "o": ["Zardushtiylik ta’limoti yer, suv, havo va olovni muqaddas deb hisoblagan.", "Zardushtiylik ta’limoti ruh, tuproq, suv va qoramolni muqaddas deb hisoblagan.", "Zardushtiylik ta’limoti yer, suv, chaqmoq va ruhni muqaddas deb hisoblagan.", "Zardushtiylik ta’limoti yer, shamol, mamoqaldiroq va olovni muqaddas deb hisoblagan."], "c": 0}, {"n": 8, "q": "So‘g‘da, So‘g‘uda, So‘g‘diyona nomlari bilan mashhur bo‘lgan tarixiy- madaniy viloyat qaysi hududlarni o‘z ichiga olgan.", "o": ["So‘g‘da, So‘g‘uda, So‘g‘diyona nomlari bilan mashhur bo‘lgan tarixiy-madaniy viloyat Zarafshon va Qashqadaryo vohalarini o‘z ichiga olgan.", "So‘g‘da, So‘g‘uda, So‘g‘diyona nomlari bilan mashhur bo‘lgan tarixiy-madaniy viloyatlar Shoshken va Surxondaryo vohalarini o‘z ichiga olgan.", "So‘g‘da, So‘g‘uda, So‘g‘diyona nomlari bilan mashhur bo‘lgan tarixiy-madaniy viloyat Eron va Kavkaz orti vohalarini o‘z ichiga olgan.", "So‘g‘da, So‘g‘uda, So‘g‘diyona nomlari bilan mashhur bo‘lgan tarixiy-madaniy viloyatlar Afg‘oniston va Surxondaryo vohalarini o‘z ichiga olgan."], "c": 0}, {"n": 9, "q": "Qadimda Oks, Araks deb nomlangan daryoning nomini toping?", "o": ["Amudaryo.", "Sirdaryo.", "Oqdaryo.", "Qoradaryo."], "c": 0}, {"n": 10, "q": "To‘maris qaysi qabilaning malikasi bo‘lgan?", "o": ["To‘maris massagetlar qabilasining malikasi bo‘lgan.", "To‘maris sog‘diylar qabilasining malikasi bo‘lgan.", "To‘maris yunonlar qabilasining malikasi bo‘lgan.", "To‘maris axmoniylar qabilasining malikasi bo‘lgan."], "c": 0}, {"n": 11, "q": "Sugʻdiyona va Baqtriyada Aleksandr boshchiligidagi yunon-makedon istilochilariga qarshi ozodlik harakatiga kim rahbarlik qilgan?", "o": ["Spitamen.", "Muqanna.", "To‘maris.", "Shiroq."], "c": 0}, {"n": 12, "q": "IX-XIII asr boshlarida O‘rta Osiyoda qaysi davlatlar hukm surgan?", "o": ["IX-XIII asr boshlarida O‘rta Osiyoda Somoniylar, Qoraxoniylar, G‘aznaviylar, Saljuqiylar va Xorazmshohlar davlatlari hukm surgan.", "IX-XIII asr boshlarida O‘rta Osiyoda Temuriylar, Boburiylar, G‘aznaviylar va Xorazmshohlar davlatlari hukm surgan.", "IX-XIII asr boshlarida O‘rta Osiyoda Boyazidxon, Chingizxon, G‘aznaviylar va Xorazmshohlar davlatlari hukm surgan.", "IX-XIII asr boshlarida O‘rta Osiyoda Genrix XII, Karl X, G‘aznaviylar davlatlari hukm surgan."], "c": 0}, {"n": 13, "q": "O‘zbekistonning qaysi hududida va qachon “Donishmandlar uyi”-“Bayt ul-Hikma”- “Ma’mun akademiyasi” tashkil topgan?", "o": ["X asr oxirlarida Xorazmda xalifa Ma'mun davrida (995-997- yillar.) “Donishmandlar uyi”-“Bayt ul-Hikma”-“Ma’mun akademiyasi” (Xorazm akademiyasi) tashkil topgan.", "XI asrda Samarqandda Bobur Mirzo davrida “Donishmandlar uyi”-“Bayt ul- Hikma”-“Ma’mun akademiyasi” (Samarqand akademiyasi) tashkil topgan.", "IX asr oxirlarida Toshkentda Mirzo Ulug‘bek davrida (885-897-yillar.) “Donishmandlar uyi”-“Bayt ul-Hikma”-“Ma’mun akademiyasi” (Toshkent akademiyasi) tashkil topgan.", "1900- yilda Farg‘onada al-Farg‘oniy davrida  “Donishmandlar uyi”-“Bayt ul-Hikma”- “Ma’mun akademiyasi” (Farg‘ona akademiyasi) tashkil topgan."], "c": 0}, {"n": 14, "q": "Sharq mamlakatlarida “Al-Muallim as-soniy” - “Ikkinchi muallim” (Aristoteldan keyin), “Sharq Arastusi” deb kimni atashgan.", "o": ["Sharq mamlakatlarida Abu Abu Ali ibn Sinoni “Al-Muallim as-soniy’ – “Ikkinchi muallim” (Aristoteldan keyin), “Sharq Arastusi” deb atashgan.", "Sharq mamlakatlarida Abu Rayhon Beruniyni “Al-Muallim as-soniy” – “Ikkinchi muallim” (Aristoteldan keyin), “Sharq Arastusi” deb atashgan", "Sharq mamlakatlarida Abu Nasr Muhammad ibn Muhammad Forobiyni “Al- Muallim as-soniy” – “Ikkinchi muallim” (Aristoteldan keyin), “Sharq Arastusi” deb atashgan.", "Sharq mamlakatlarida Alisher Navoiyni “Al-Muallim as-soniy” – “Ikkinchi muallim” (Aristoteldan keyin), “Sharq Arastusi” deb atashgan."], "c": 2}, {"n": 15, "q": "“Renessans” so‘ziga to‘g‘ri ta’rif berilgan javobni tanlang.", "o": ["“Renessans” so‘zi lotincha “Renesson”, ispancha – “Rinascinentoniyo” – tugallangan, yakun topgan, tamomlangan – degan ma’nolarni anglatadi.", "“Renessans” so‘zi fransuzcha “Renessonce”, italyancha – “Rinascinento” – qayta yuzaga kelmoq, yanidan tug‘ilmoq, qayta tirilish, uyg‘onish – degan ma’nolarni anglatadi.", "“Renessans” so‘zi nemischa “Reneshson”, inglis – “Renassanse” – yaratmoq, ishlab chiqmoq, vujudga keltirmoq, ro‘yobga chiqarmoq – degan ma’nolarni anglatadi.", "“Renessans” so‘zi ispancha “Renessonio”, lotincha – “Renassinens” – o‘ylab topilgan, ixtiro qilingan, yaratilgan – degan ma’nolarni anglatadi."], "c": 1}, {"n": 16, "q": "Qaysi sulola hukmronlik qilgan davrda o‘zbek xalqining shakllanishida yakunlovchi bosqich bo‘ldi?", "o": ["Mo‘g‘ullar.", "Temuriylar.", "Gunjaviylar.", "Qoraxoniylar."], "c": 3}, {"n": 17, "q": "Movarounnahrda joylashgan aholi qadimdan qaysi ikki tilda so‘zlashgan?", "o": ["Xorazm va fors.", "Sug‘d va xorazm.", "Sug‘d va turk.", "Baqtriya va xorazm."], "c": 2}, {"n": 18, "q": "Shiroqning jasorati haqida hikoya qilgan antik davr tarixchisi kim?", "o": ["Polien.", "Arrian.", "Gerodot.", "Arastu."], "c": 0}, {"n": 19, "q": "Birinchi Sharq Uyg‘nish davri qaysi asrlarda mintaqamizda yuz bergan?", "o": ["VI-VIII asrlarda.", "XV-XVI asrlarda.", "IX-XII asrlarda.", "V-VI asrlarda."], "c": 2}, {"n": 20, "q": "Ikkinchi Sharq Uyg‘nish davri qaysi asrlarda mintaqamizda yuz bergan?", "o": ["XVII-XVIII asrlarda.", "XIV-XVI asrlarda.", "XVIII-XIX asrlarda.", "IX-XII asrlarda."], "c": 1}, {"n": 21, "q": "Birinchi Sharq Uyg‘nish davrida faoliyat olib borgan buyuk allomalar va mashhur mutafakkirlar nomlari ko‘rsatrilgan javobni toping.", "o": ["Muhammad Muso al-Xorazmiy, Abu Rayhon Beruniy, Abu Ali ibn Sino, Ahmad al-Farg‘oniy, Abu Nasr Forobiy, Yusuf Xos Hojib.", "Mahmud Koshg‘ariy, Mahmud Zamaxshariy, Mirzo Ulug‘bek, imom Buxoriy, Alisher Navoiy.", "Abul Muin Nasafiy, Qozizoda Rumiy, Mirzo Ulug‘bek, G‘iyosiddin Koshiy, Ali Qushchi.", "Sharafiddin Ali Yazdiy, imom Termiziy, imom Moturudiy, Xondamir, Abdurahmon Jomiy."], "c": 0}, {"n": 22, "q": "Ikkinchi Sharq Uyg‘nish davrida faoliyat olib borgan buyuk allomalar va mashhur mutafakkirlar nomlari ko‘rsatrilgan javobni toping.", "o": ["Ahmad al-Farg‘oniy, Abu Nasr Forobiy, Yusuf Xos Hojib, Sharafiddin Ali Yazdiy, Mirxond.", "Mirzo Ulug‘bek, G‘iyosiddin Koshiy, Ali Qushchi, Alisher Navoiy, Zahiriddin Muhammad Bobur.", "Muhammad Muso al-Xorazmiy, Zahiriddin Muhammad Bobur, Abu Rayhon Beruniy, Xondamir, Kamoliddin Behzod.", "Abu Rayhon Beruniy, Abu Ali ibn Sino, Ahmad al-Farg‘oniy, Ali Qushchi, Mahmud Muzahhib."], "c": 1}, {"n": 23, "q": "“Alpomish” dostoni qaysi xalq og‘zaki ijodiga mansub?", "o": ["Qozoq xalqi.", "Qirg‘iz xalqi.", "O‘zbek xalqi.", "Turkman xalqi."], "c": 2}, {"n": 24, "q": "“Kuntug‘mish” ,“Alibek va Bolibek” dostonlarini xalq orasida kimlar ijro etgan?", "o": ["Qo‘shiqchilar.", "Shoirlar.", "Dramaturglar.", "Baxshilar."], "c": 3}, {"n": 25, "q": "“Alibek bilan Bolibek” dostonida ikki qahramon kimlar?", "o": ["Ikki aka-uka.", "Ikki do‘st.", "Ikki raqib.", "Ikki oshiq."], "c": 0}, {"n": 26, "q": "Zahiriddin Muhammad Bobur nechanchi yilda va necha yoshida taxtga o‘tiradi?", "o": ["1494- yilda, 12 yoshida.", "1491- yilda, 10 yoshida", "1495- yilda, 13 yoshida", "1498- yilda, 16 yoshida"], "c": 0}, {"n": 27, "q": "Sugʻdiyona va Baqtriyada Aleksandr boshchiligidagi yunon-makedon istilochila ransportida – bir-ikkita harbiy eshelonda, havo transportida – bir-ikkita harbiy komandalarda, og‘ir avtopoezdlarda esa bir- ikkita kolonnada amalga oshiriladi", "Batalyonni tashish temir yo‘l transportida – bir-ikkita harbiy eshelonda, havo transportida – bir-ikkita harbiy komandalarda, og‘ir avtopoezdlarda esa bitta kolonnada amalga oshiriladi 73. Qurolli kuchlar turlari bu:", "davlat QKning qo‘shin turi bo‘lib, uning o‘ziga xos bo‘lgan harbiy harakatlarni belgilangan muhitda olib borishga mo‘ljallangan", "mudofaa vazirligining tarkibiy qismi bo‘lib, uning o‘ziga xos bo‘lgan harbiy harakatlarni belgilangan muhitda (quruqlikda, dengizda va havo sarxatlarida) olib borishga mo‘ljallangan", "jangovar vazifalarni bajarish uchun, Qurolli kuchlar tarkibiga kiruvchi QK turlari, birlashmalari, qo‘shilmalari, qismlari, qo‘shin turlari, mahsus  qo‘shinlar, qurol-yarog‘‘, harbiy texnika va shaxsiy tarkib miqdorini (sonini) ko‘rsatuvchi tavsifga aytiladi", "davlat QKning tarkibiy qismi bo‘lib, uning o‘ziga xos bo‘lgan harbiy harakatlarni belgilangan muhitda (quruqlikda, dengizda va havo sarxatlarida) olib borishga mo‘ljallangan"], "c": 3}, {"n": 74, "q": "Ichkaridan haraktlanib hujumga o‘tishda guruh kolonnalariga yoyilish marrasi dushman mudofaasi oldingi chizig‘idan qancha uzoqlikda tayinlanishi mumkin?", "o": ["1-2 km uzoqlikda", "4-6 km uzoqlikda", "2-3 km uzoqlikda", "600 metrgacha uzoqlikda"], "c": 2}, {"n": 75, "q": "Batalyonning (batalyon taktik guruhining) mudofaa jangida jangovar tartibi nimalardan tashkil topganligi to‘g‘ri ko‘rsatilgan qatorni belgilang.", "o": ["Birinchi eshelon, ikkinchi eshelon artilleriya, zenit va tankka qarshi kurash bo‘linmalari, muuxandislik to‘siqlari, umumqo‘shin zahira, zirhli guruhi va olovli pistirmalaridan", "Birinchi eshelon, ikkinchi eshelon artilleriya, zenit va tankka qarshi kurash bo‘linmalari, muxandislik to‘siqlari, umumqo‘shin zahirasidan", "Umumqo‘shin zahira, zirhli guruhi va olovli pistirmalari, birinchi eshelon, ikkinchi e ishni taʼriflang", "o": ["qon jaroxat yuzasiga sizib chiqadi", "xavfli , bosim ostida qon otilib chiqadi", "Bir  xil ravon qon oqib turadi, toʻq qizil rangda", "qon ketish  oʻz-oʻzidan toʻxtab qoladi"], "c": 2}, {"n": 88, "q": "Suyaklar sinishi necha xil boʻladi", "o": ["2 xil ochiq va yopiq sinishlar", "4 xil", "3 xil", "5 xil"], "c": 0}, {"n": 89, "q": "Shaxsiy aptechka (AI)ning qoʻllanishi", "o": ["Dushman tomonidan ommaviy qirgʻin qurollari qoʻllanganda birinchi tibbiy yordam koʻrsatish uchun", "Suyak singanda", "Qon ketganda  birinchi tibbiy yordam koʻrsatish uchun", "Yoʻtalganda ishlatish uchun"], "c": 0}, {"n": 90, "q": "Harbiy xizmatchilarning shaxsiy tibbiy vositalariga nimalar  kiradi", "o": ["shaxsiy aptechka, qon toʻxtatuvchi rezina jgut, pantotsid, shaxsiy bogʻlov paketi, IPP-8.", "shaxsiy aptechka", "qoʻshin tibbiy sumkasi", "tibbiy zambil"], "c": 0}]}, {"t": "Otish tayyorgarligi", "q": [{"n": 1, "q": "O‘q otish asoslariga nima kiradi?", "o": ["Belgilangan vaqt oralig‘ida qurolning moddiy qismlariga, xavfsizlik choralariga ziyon yetkazmay va o‘q otish natijalarini yomonlashtirmay eng ko‘p miqdorda otish asoslari.", "Aylanayotgan o‘qning trayektoriyasini, og‘irlik kuchi va yo‘nalishini o‘rgatuvchi qonuni.", "Ichki ballistika, tashqi ballistika va o‘qlarning yoyilish qonuni.", "O‘qning fazodagi xarakatini o‘rgatuvchi fan."], "c": 2}, {"n": 2, "q": "To‘g‘ridan-to‘g‘ri otish deb nimaga aytiladi?", "o": ["Trayektoriyasi mo‘ljallanish chizig‘ida nishondan balandga ko‘tarilmaydigan otish.", "Trayektoriyasi mo‘ljallanish chizig‘ida nishondan balandga ko‘tarilib otish.", "O‘qning (granataning) yonlama va uzoqlik (balandlik) bo‘yicha yoyilishiga asosan otish.", "Trayektoriyaga urinma va qurol gorizonti orasidagi masofaga aytiladi."], "c": 0}, {"n": 3, "q": "O‘q uzilish jarayoni necha davrdan iborat?", "o": ["O‘q otishda 4 ta ketma-ket davr mavjud, Oldingi, birinchi yoki asosiy davr, ikkinchi davr, uchinchi davr, yoki gazlar ta’siridan keyingi davr.", "O‘q otishda 6 ta ketma-ket davr mavjud, Oldingi, birinchi, asosiy davr, ikkinchi davr, uchinchi davr, gazlar ta’siridan keyingi davr.", "O‘q otishda 4 ta ketma-ket davr mavjud, Asosiy davr, birinchi davr, ikkinchi davr, gazlar ta’siridan keyingi davr.", "O‘q otishda 3 ta ketma-ket davr mavjud, Birinchi, asosiy davr, ikkinchi davr, uchinchi davr, gazlar ta’siridan keyingi davr."], "c": 0}, {"n": 4, "q": "O‘qning boshlang‘ich tezligi deb nimaga aytiladi?", "o": ["O‘qning stvolning og‘iz kesimi yaqinidagi harakat tezligi boshlang‘ich tezlik deb ataladi.", "Stvolning uzunligiga, o‘qning og‘irligiga, porox zaryadining haroratini va namligiga, porox zarralarining shakl va o‘lchamlariga hamda o‘qlanish zichligiga bog‘liq xarakati boshlang‘ich tezlik deb ataladi.", "O‘qning stvoldan chiqishi va nishongacha tezlik bilan borib tegishi boshlang‘ich tezlik deb ataladi.", "Qurolning tepinishi yelkaga, qo‘lga va yerga kuch bilan urilish boshlang‘ich tezlik deb ataladi."], "c": 0}, {"n": 5, "q": "O‘q uzish deb nimaga aytiladi?", "o": ["O‘q uzish deb porox zaryadining yonishi natijasida hosil bo‘lgan gazlar energiyasi ta’sirida stvol kanalidan o‘qning (granataning) otilib chiqishiga (irg‘itilishiga) aytiladi.", "O‘q uzish deb stvolning uzunligiga, o‘qning og‘irligiga, porox zaryadining harorati va namligiga, porox zarralarining shakl va o‘lchamlariga hamda o‘qlanish zichligiga bog‘liq tartibda stvoldan otilib chiqishiga aytiladi.", "Porox gazlarining yuqori harorati, stvol kanalining vaqti-vaqti bilan kengayishi va uning boshlang‘ich holatga qaytishi o‘q uzish deb aytiladi.", "O‘q uzish deb o‘qdorilarning yonishi natijasidagi gazlarining yuqori harorati nitijasida stvoldan otilib chiqishiga o‘q uzish deb aytiladi."], "c": 0}, {"n": 6, "q": "Ichki ballistika nima?", "o": ["O‘qning (granataning) porox gazlari ta’siri tugagandan keyin harakatlarini o‘rganuvchi fan.", "Otish paytida hosil bo‘ladigan jarayonlarni, xususan o‘q (granata)ning stvol kanalida harakatlanishini o‘rganuvchi fan.", "O‘qlarning yoyilish qonuni o‘rganuvchi fan.", "Otishdan so‘ng hosil bo‘ladigan jarayonlarni, xususan o‘q (granata)ning patronnikda harakatlanishini o‘rganuvchi fan."], "c": 1}, {"n": 7, "q": "Tepinish deb nimaga aytiladi?", "o": ["Trayektoriyaga urinma va qurol gorizonti orasidagi tepinishga aytiladi.", "Yelkaga, qo‘lga va yerga kuch bilan urilish tepinish deb aytiladi.", "O‘q otish paytida qurol (stvol)ning orqaga harakatlanishiga aytiladi.", "Qo‘ndoq orqali qo‘rol (stvol)ning yelkagi kuch bilan urilish tepinish deb aytiladi."], "c": 2}, {"n": 8, "q": "Stvolning yeyilishini keltirib chiqaruvchi sabablar.", "o": ["O‘q otish jarayonida stvol yeyiladi. Stvolning yeyilish sabablarini uchta asosiy guruhlarga – avtomatik, mexanik va fizik xarakterdagi sabablarga bo‘lish mumkin.", "O‘q otish jarayonida stvol yeyiladi. Stvolning yeyilish sabablarini uchta asosiy guruhlarga – kimyoviy, mexanik va termik xarakterdagi sabablarga bo‘lish mumkin.", "O‘q otish jarayonida stvol yeyiladi. Stvolning yeyilish sabablarini uchta asosiy guruhlarga – avtomatik, fizik va kimyoviy xarakterdagi sabablarga bo‘lish mumkin.", "O‘q otish jarayonida stvol yeyiladi. Stvolning yeyilish sabablarini uchta asosiy guruhlarga – jismoniy, fizik va kimyoviy xarakterdagi sabablarga bo‘lish mumkin."], "c": 1}, {"n": 9, "q": "Stvol mustahkamligi deb nimaga ataladi?", "o": ["O‘qotar qurollarning xromlangan stvollari kuchliligiga o‘q uzishlarga aytiladi.", "Belgilangan vaqt oralig‘ida qurolning moddiy qismlariga, xavfsizlik choralariga ziyon yetkazmay va o‘q otish natijalarini yomonlashtirmay eng ko‘p miqdorda otishiga aytiladi.", "Stvolning belgilangan miqdordagi o‘qning otilishiga chidab berishiga aytiladi.", "Stvol kanalida stvol devorlarining ma’lum gazlar bosimini ushlab turuvchi qobiliyati aytiladi."], "c": 3}, {"n": 10, "q": "Tashqi ballistika nima?", "o": ["Har xil sharoitlarda faqat birgina quroldan otish paytida o‘q (granata)larning yoyilish hodisasini, o‘q (granata)larning tabiiy yoyilishini hamda trayektoriyasini o‘rgatuvchi fan.", "O‘qning (granataning) porox gazlari ta’siri tugagandan keyin harakatlarini o‘rganuvchi fan.", "Har xil sharoitlarda quroldan otish paytida o‘qning trayektoriyasini o‘rgatuvchi fan.", "O‘qning (granataning) havoda uchish jarayonida og‘irlik markazi hosil qiladigan jarayon, hamda yerning yuzasiga va havoning zichligiga bog‘liqligini o‘rganuvchi fan."], "c": 1}, {"n": 11, "q": "Otish rejimi deb nimaga aytiladi?", "o": ["Ko‘rsatilgan vaqt oralig‘ida o‘qning (granataning) porox gazlari ta’siri tugagandan keyingi harakatlarini o‘rganuvchi jarayon otish rejimi deb aytiladi.", "O‘qning otish tekisligidan aylanish tomonga qarab og‘ishi otish rejimi deb aytiladi.", "Belgilangan vaqt oralig‘ida qurolning moddiy qismlariga, xavfsizlik choralariga ziyon yetkazmay va o‘q otish natijalarini yomonlashtirmay eng ko‘p miqdorda otishiga aytiladi.", "Ko‘rsatilgan vaqt oralig‘ida o‘qdorilarning moddiy qismlariga, o‘q otish natijalarini yomonlashtirish orqali eng kam miqdorda sarf qilinishi otish rejimi deb aytiladi."], "c": 2}, {"n": 12, "q": "Derivatsiya deb nimaga ataladi?", "o": ["O‘qning otish tekisligidan aylanish tomonga qarab og‘ishi va shu bilan birgalikda o‘qning aylanma harakati, havoning qarshiligi va og‘irlik kuchi ta’sirida trayektoriyaga urinmaning pasayishiga aytiladi.", "Havo qarshilik kuchining kattaligi o‘qning (granataning) uchish tezligiga, kalibriga va shakliga, hamda uning yuzasiga va havoning zichligiga bog‘liqligiga aytiladi.", "O‘qning otish yo‘nalishidan orqaga aylanishi va shu bilan birgalikda o‘qning qarama qarshi harakati, havoning namligi va og‘irlik kuchi ta’siridan qo‘rol ufqiga urinmaning pasayishiga aytiladi.", "Nishonga to‘g‘rilangan qurol stvol kanali o‘qining davomi hisoblangan to‘g‘ri chiziq ko‘tarilish chizig‘iga aytiladi."], "c": 0}, {"n": 13, "q": "O‘qlarning yoyilishi deb nimaga ataladi?", "o": ["Sharoiti bir xil va birgina quroldan otish paytidagi aylanish hodisasiga aytiladi.", "Boshlang‘ich tezliklarning har xilligiga aytiladi.", "Otish yo‘nalishini va irg‘itish burchaklarining har xilligiga aytiladi.", "Bir xil sharoitlarda faqat birgina quroldan otish paytidagi yoyilish hodisasiga aytiladi."], "c": 3}, {"n": 14, "q": "Trayektoriya deb nimaga aytiladi?", "o": ["Uchib chiqish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "O‘qning (granataning) havoda uchish jarayonida og‘irlik markazi hosil qiladigan egri chiziqqa aytiladi.", "Qurolning (granataning) muallaq uchish jarayonida yengilik markazida hosil bo‘ladigan to‘g‘ri chiziqqa aytiladi.", "Nishonga to‘g‘rilangan qurol stvol kanali o‘qining davomi hisoblangan to‘g‘ri chiziqqa aytiladi."], "c": 1}, {"n": 15, "q": "Uchib chiqish nuqtasi deb nimaga ataladi?", "o": ["O‘q uchib chiqishi paytida stvol kanali o‘qining davomi hisoblanuvchi to‘g‘ri chiziq bo‘ylab irg‘itishga aytiladi.", "Nishonga to‘g‘rilangan qurol stvoli kanalidan o‘qning davomi hisoblangan to‘g‘ri chiziqqa aytiladi.", "Qurol stvoli og‘iz kesimining markaziga aytiladi.", "Nishonga to‘g‘rilangan qurol (granatomet) stvoli kanalidan o‘q (granata)ning uchib chiqishi davomi hisoblangan to‘g‘ri chiziqqa aytiladi."], "c": 2}, {"n": 16, "q": "Havo qarshilik kuchining kattaligi nimaga bog‘liq?", "o": ["O‘q (granata)larning yoyilishi tasodifiy xatolarning normal qonuniga bo‘ysunadi, u esa o‘q (granata) lar yoyilishiga nisbatan yoyilish qonuni bo‘lib, bu sabablar o‘qning (granataning) yonlama va uzoqlik (balandlik) bo‘yicha yoyilishiga olib keladi va asosan otishning tashqi shartlari bog‘liq.", "O‘q (granata)larning yoyilishi aniq xatolarning normal qonuniga bo‘ysunadi, bu esa o‘qning (granataning) yonlama va uzoqlik (balandlik) bo‘yicha yoyilishiga olib kelishiga asosan otishning tashqi shartlari bog‘liq.", "Bosim orqali havoning kuchini o‘rtachaligi o‘qning (granataning) uchish harakatiga, stvolning yirikligiga va baquvvatligiga, hamda uning havoni kesib o‘ta olish qobiliyatiga bog‘liq.", "Havo qarshilik kuchining kattaligi o‘qning (granataning) uchish tezligiga, kalibriga va shakliga, hamda uning yuzasiga va havoning zichligiga bog‘liq."], "c": 3}, {"n": 17, "q": "Ko‘tarilish chizig‘i deb nimaga aytiladi?", "o": ["Nishonga to‘g‘rilangan qurol stvol kanali o‘qining davomi hisoblangan to‘g‘ri chiziqqa aytiladi.", "Tushish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "Uchib chiqish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "Tushish orqali o‘qning egri nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi."], "c": 0}, {"n": 18, "q": "Otish tekisligi deb nimaga aytiladi?", "o": ["Tushish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "Ko‘tarilish chizig‘i orqali o‘tuvchi vertikal tekislikka aytiladi.", "Uchib chiqish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "Otilib chiqish nuqtasi orqali o‘tuvchi vertikal tekislikka aytiladi."], "c": 1}, {"n": 19, "q": "Ko‘tarilish burchagi deb nimaga aytiladi?", "o": ["Irg‘itish chizig‘i bilan qurol ufqi (gorizonti) orasidagi burchakka aytiladi.", "Ko‘tarilish chizig‘i bilan o‘q (granata) yo‘nalishining ufqi (gorizonti) orasidagi masofaga aytiladi.", "Ko‘tarilish chizig‘i bilan qurol ufqi orasidagi burchakka aytiladi.", "Ko‘tarilish chizig‘i va irg‘itish chizig‘i orasidagi burchakka aytiladi."], "c": 2}, {"n": 20, "q": "Irg‘itish chizig‘i deb nimaga aytiladi?", "o": ["Uchib chiqish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "Tushish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "O‘q uchib chiqishi paytida stvol kanali o‘qining davomi  hisoblanuvchi to‘g‘ri chiziqqa aytiladi.", "Uchib chiqish nuqtasi orqali o‘tuvchi kesik gorizontal tekislikka aytiladi."], "c": 2}, {"n": 21, "q": "Irg‘itish burchagi deb nimaga aytiladi?", "o": ["Tushish nuqtasi va irg‘itish burchagi  (gorizonti) orasidagi burchakka aytiladi.", "Irg‘itish chizig‘i bilan qurol ufqi (gorizonti) orasidagi burchakka aytiladi.", "Ko‘tarilish chizig‘i va irg‘itish chizig‘i (gorizonti) orasidagi burchakka aytiladi.", "Otilish chizig‘i bilan qurol ufqi (gorizonti) orasidagi masofaga aytiladi."], "c": 1}, {"n": 22, "q": "Uchish burchagi deb nimaga aytiladi?", "o": ["Uchib chiqish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "Tushish nuqtasi va irg‘itish burchagi orasidagi burchakka aytiladi.", "Ko‘tarilish chizig‘i va irg‘itish chizig‘i orasidagi burchakka aytiladi.", "Uchish nuqtasi orasidan o‘tuvchi gorizontal tekislikka aytiladi."], "c": 2}, {"n": 23, "q": "Qurol ufqi (gorizonti) deb nimaga aytiladi?", "o": ["Uchib chiqish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "Tushish nuqtasi orqali o‘tuvchi gorizontal tekislikka aytiladi.", "Trayektoriyaning pastga qarab ketishiga aytiladi.", "Uchish nuqtasi orasidan o‘tuvchi gorizontal tekislikka aytiladi."], "c": 0}, {"n": 24, "q": "Tushish nuqtasi deb nimaga aytiladi?", "o": ["Tushish nuqtasi orqali o‘tuvchi urinma va qurol gorizonti orasidagi gorizontal tekislikka aytiladi.", "Tushish nuqtasida trayektoriyaga urinma va qurol gorizonti orasidagi burchagiga aytiladi.", "Trayektoriyaning yuqorilab ketishiga aytiladi.", "Trayektoriyaga urinma va qurol gorizonti orasidan pastga qarab ketishiga aytiladi."], "c": 1}, {"n": 25, "q": "Patronlarning belgilari odatda ikkita sonli ko‘rsachlardan iborat: Masalan: 7.62 x 51. Bu nimalarni belgilaydi?", "o": ["O‘qning kalibri va gilzaning uzunligini.", "O‘qning kalibrini.", "O‘qning kalibri va o‘qning uzunligini.", "Zavod partiyasi va gilzaning qalinligini."], "c": 0}, {"n": 26, "q": "Patronlarning belgilari odatda ikkita sonli ko‘rsachlardan iborat: Masalan: 7.62x51. Bu nimalarni belgilaydi?", "o": ["O‘qning kalibri va gilzaning uzunligini.", "O‘qning kalibrini.", "O‘qning kalibri va o‘qning uzunligini.", "Zavod partiyasi va gilzaning qalinligini."], "c": 0}, {"n": 27, "q": "Jangovar zaryad yonishida ajraladigan energiya qanday ishlarga sarflanadi:", "o": ["O‘qning ilgarilanma harakatlanishiga, o‘qqa aylanma harakat berishga; stvol kanalida harakatlanishida ishqalanish ishini yengishga; qurolning ort vol devorlari metallining porox gazlari bosimiga chidamliligi.", "stvol devorlari metallining o‘q bosimiga chidamliligi.", "stvol devorlari metallining porox gazlari yurishiga chidamliligi."], "c": 0}, {"n": 62, "q": "Otish kursining mo‘ljallanishini ayting?", "o": ["Otish kursi muddatli harbiy xizmatchilar, safarbarlik chaqiruvi rezervi xizmatchilari, harbiy ta’lim muassasalari (bundan buyon matnda HTM deb yuritiladi) kursantlari, ofitserlar, harbiy xizmatchilar tarkibiga (bundan buyon matnda o‘rganuvchilar deb yuritiladi) o‘qotar qurol, granatomyot, olib yuriladigan tankka qarshi komplekslar hamda jangovar mashina vertolyot qurol-aslahalarini zamonaviy jang va maxsus harakatlarda mohirona va samarali qo‘llashni o‘rgatish uchun mo‘ljallangan.", "Otish kursi muddatli harbiy xizmatchilar, safarbarlik chaqiruvi rezervi xizmatchilari, harbiy ta’lim muassasalari (bundan buyon matnda HTM deb yuritiladi) kursantlari, kontrakt bo‘yicha harbiy xizmatchilar tarkibiga (bundan buyon matnda o‘rganuvchilar deb yuritiladi) o‘qotar qurol, granatomyot, olib yuriladigan tankka qarshi komplekslar hamda jangovar mashina va tanklarning qurol-aslahalarini zamonaviy jang va maxsus harakatlarda mohirona va samarali qo‘llashni o‘rgatish uchun mo‘ljallangan.", "Otish kursi barcha harbiy xizmatchilar, safarbarlik chaqiruvi rezervi xizmatchilari, harbiy ta’lim muassasalari (bundan buyon matnda HTM deb yuritiladi) kursantlari, kontrakt bo‘yicha harbiy xizmatchilar tarkibiga (bundan buyon matnda o‘rganuvchilar deb yuritiladi) avtomatik qurol, granatomyot, olib yuriladigan tankka qarshi komplekslar hamda jangovar mashina va tanklarning qurol-aslahalarini maxsus harakatlarda mohirona va samarali qo‘llashni o‘rgatish uchun xizmat qiladi.", "Barcha javoblar to‘g‘ri."], "c": 1}, {"n": 63, "q": "Mashqni bajarganlik uchun belgilanadigan baho qaysi hollarda bir ballga pasaytiriladi?", "o": ["Agar o‘q uzayotgan shaxs, mashqni bajarish shartlarida nazarda tutilgan, jangovar mashinalarning qurollaridan  qisqa to‘xtalishlar va harakat davomida o‘t ochish uchun ajratilgan umumiy vaqtni 20 soniyadan   oshirib yubormagan bo‘lsa; Agar tank, BMP to‘pidan o‘t ochish mobaynida nishonga qarata birinchi o‘q (navbat) o‘rnatilgan vaqtdan kech otilgan bo‘lsa;  (barcha tanklar va BMP-2 otish vaqtida shtatdagi snaryadlari bilan 15 daqiqadan oshmaganda, tanklar uchun shtatdagi snaryadlar bilan va BTR-80 uchun 20 daqiqadan oshmaganda, qolgan obektlar uchun va BMP-1 (BMD-1) jangovar mashinalariga  25 daqiqadan oshmagan. Shuningdek, ko‘rsatilgan nishonlardan biriga qarata o‘q uzilmagan bo‘lsa. Agar o‘q uzayotgan shaxs, mashqni bajarish shartlarida nazarda tutilgan, jangovar mashinalarning qurollaridan  qisqa to‘xtalishlar va harakat davomida o‘t ochish uchun ajratilgan umumiy vaqtni 10 soniyadan   oshirib yubormagan bo‘lsa;", "Agar tank, BMP to‘pidan o‘t ochish mobaynida nishonga qarata birinchi o‘q (navbat) o‘rnatilgan vaqtdan kech otilgan bo‘lsa;  (barcha tanklar va BMP-2 otish vaqtida shtatdagi snaryadlari bilan 15 daqiqadan oshmaganda, tanklar uchun shtatdagi snaryadlar bilan va BTR-80 uchun 20 daqiqadan oshmaganda, qolgan obyektlar uchun va BMP-1 (BMD-1) jangovar mashinalariga  25 daqiqadan oshmagan bo‘lsa.", "Quyidagi hollarda mashqning ijrosiga qo‘yilgan baho bir ballga pasaytiriladi: agar tank, BMP to‘pi (quroli)dan otishda nishonga birinchi (navbatdagi) o‘q uzish  belgilangan vaqtdan kechikib amalga oshirilgan bo‘lsa (shtatdagi artilleriya snaryadlarining o‘rniga qo‘llaniladigan o‘q-dorilar bilan otishda barcha tanklar, BMP-2 va BTR-82A uchun – 15 soniyagacha, shtatdagi artilleriya o‘q-dorilari bilan otishda barcha tanklar, BTR-80 va BRDM uchun – 20 soniyagacha, boshqalar shu jumladan BMP-1 (BMD-1) uchun – 25 soniyagacha); har qaysi o‘qqa tutilmagan nishon uchun.", "Barcha javoblar to‘g‘ri."], "c": 2}, {"n": 64, "q": "O‘rganuvchining otish tayyorgarligini yakka tartibda baholashda baho qanday tartibda baholanadi ?", "o": ["“a’lo”, agar otish mashg‘ulotidagi mashqlarni bajargani uchun “a’lo”, meyorlar bajarilishi uchun “yaxshi”dan past bo‘lmagan baho olgan bo‘lsa; ofitserlar tarkibiga mansub kontrakt bo‘yicha harbiy xizmatchilar uchun – ikkala baho ham “a’lo” bo‘lishi kerak; “yaxshi”, agar otish mashg‘ulotidagi mashqlarni bajargani uchun “yaxshi”dan past bo‘lmagan, meyorlar bajarilishi uchun “qoniqarli”dan past bo‘lmagan baho olgan bo‘lsa; ofitserlar tarkibiga mansub kontrakt bo‘yicha harbiy xizmatchilar uchun – ikkala baho ham “yaxshi”dan past bo‘lmasligi kerak; “qoniqarli”, agar ikkala baho ham “qoniqarli”dan past bo‘lmasa yoki otish mashg‘ulotidagi mashqlarini bajargani uchun “yaxshi”dan past bo‘lmagan, meyorlar bajarilishi uchun “qoniqarsiz” baho olgan bo‘lsa; ofitserlar tarkibiga mansub kontrakt bo‘yicha harbiy xizmatchilar uchun – ikkala baho “qoniqarli”dan past bo‘lmasligi kerak;", "«a’lo», amaliy o‘t ochish natijalariga «a’lo», otish asoslari va qoidalari bo‘yicha bilimlari «yaxshi» deb topilgan bo‘lsa; ofitserlar uchun ikkala baholar «a’lo» bo‘lishi lozim; «yaxshi», agar amaliy o‘t ochish natijalariga «yaxshi» dan past bo‘lmagan, otish asoslari va qoidalari bo‘yicha bilimlariga «qoniqarli» dan past bo‘lmagan baholar belgilangan bo‘lsa; «qoniqarli», agar amaliy o‘t ochish natijalariga «qoniqarli» dan past bo‘lmagan, otish asosolari va qoidalari bo‘yicha bilimlariga «qoniqarsiz» baholangan bo‘lsa.", "«a’lo», amaliy o‘t ochish natijalariga «a’lo», otish asoslari va qoidalari bo‘yicha bilimlari «yaxshi» deb topilgan bo‘lsa; ofitserlar uchun ikkala baholar «a’lo» bo‘lishi lozim; «yaxshi», agar amaliy o‘t ochish natijalariga «qoniqarlidan» dan past bo‘lmagan, otish asoslari va qoidalari bo‘yicha bilimlariga «qoniqarli» dan past bo‘lmagan baholar belgilangan bo‘lsa; «qoniqarli», agar ikkala amallar uchun baho «qoniqarli» dan past bo‘lmagan tarzda topilgan bo‘lsa yoki amaliy o‘t ochish natijalariga «yaxshi» baho belgilangan, otish asoslari va qoidalari bo‘yicha bilimlari esa «qoniqarsiz» deb topilgan bo‘lsa; ofitserlar uchun ikkala amallar uchun baholar «qoniqarli» dan past bo‘lmasa.", "«a’lo», amaliy o‘t ochish natijalariga «a’lo», otish asoslari va qoidalari bo‘yicha bilimlari «yaxshi» deb topilgan bo‘lsa; ofitserlar uchun ikkala baholar «a’lo» bo‘lishi lozim; «yaxshi» agar amaliy o‘t ochish natijalariga «qoniqarlidan» dan past bo‘lmagan, otish asoslari va qoidalari bo‘yicha bilimlariga «qoniqarli» dan past bo‘lmagan baholar belgilangan bo‘lsa."], "c": 0}, {"n": 65, "q": "Quguqlikdagi qo‘shinlar o‘q otar qurollar, jangovar mashinalar va tanklalardan otish kursi qaysi buyrug’ga asosan tasdiqlangan?", "o": ["O‘R MVning 2023 yil 2 may kunidagi 375-sonli buyrug‘i", "O‘R MVning 2020 yil 29 avgust kunidagi 560-sonli buyrug‘i", "O‘R MVning 2022 yil 2 may kunidagi 259-sonli buyrug‘i", "O‘R MVning 2022 yil 19 aprel kunidagi 320-sonli buyrug‘i"], "c": 0}, {"n": 66, "q": "Nishonlarni kuzatuv bilan razvedka qilish va nishon ko‘rsatishga oid mashqlar qaysi buyruqda belgilab o‘tilgan?", "o": ["O‘R MV ning 2014 yil 20 iyundagi 424-sonli buyrug‘ida.", "O‘R MV ning 2023 yil 2 maydagi 375-sonli buyrug‘ida.", "O‘R MV ning 2020 yil 30 avgustdagi 650-sonli buyrug‘ida."], "c": 1}, {"n": 67, "q": "Otish maydonida dastlabki marra bilan o‘t otish marrasi orasidagi masofa: (O‘qotar qurollar uchun)", "o": ["kamida 8 m.", "kamida 15 m.", "kamida 10 m."], "c": 2}, {"n": 68, "q": "Bo‘linmalar qo‘shinlarning otish maydonlariga (direktrisaga, otish shaharchasiga) otish mashg‘uloti boshlanishidan ...... oldin, kechikmasdan yetib kelishi kerak.", "o": ["45 daqiqa.", "30 daqiqa.", "60 daqiqa."], "c": 1}, {"n": 69, "q": "Qaysi hollarda mashqning ijrosiga qo‘yilgan baho bir ballga pasaytiriladi?", "o": ["- agar jangovar mashinalar qurol-aslahalaridan harakat mobaynida va qisqa to‘xtab otishda otuvchi mashq shartlarida nazarda tutilgan otish uchun sarflanadigan umumiy vaqtdan 20 soniya oshirmagan holda otgan bo‘lsa; - agar tank, BMP to‘pi (quroli)dan otishda nishonga birinchi (navbatdagi) o‘q uzish belgilangan vaqtdan kechikib amalga oshirilgan bo‘lsa (shtatdagi artilleriya snaryadlarining o‘rniga qo‘llaniladigan o‘q-dorilar bilan otishda barcha tanklar, BMP- 2 va BTR-82A uchun – 25 soniyagacha, shtatdagi artilleriya o‘q-dorilari bilan otishda barcha tanklar, BTR-80 va BRDM uchun – 15 soniyagacha, boshqalar shu jumladan BMP-1 (BMD-1) uchun – 20 soniyagacha); - agar ko‘rsatilgan nishonlardan bittasi o‘qqa tutilmagan bo‘lsa.", "- agar jangovar mashinalar qurol-aslahalaridan harakat mobaynida va qisqa to‘xtab otishda otuvchi mashq shartlarida nazarda tutilgan otish uchun sarflanadigan umumiy vaqtdan 10 soniya oshirmagan holda otgan bo‘lsa; - agar tank, BMP to‘pi (quroli)dan otishda nishonga birinchi (navbatdagi) o‘q uzish belgilangan vaqtdan kechikib amalga oshirilgan bo‘lsa (shtatdagi artilleriya snaryadlarining o‘rniga qo‘llaniladigan o‘q-dorilar bilan otishda barcha tanklar, BMP- 2 va BTR-82A uchun – 15 soniyagacha, shtatdagi artilleriya o‘q-dorilari bilan otishda barcha tanklar, BTR-80 va BRDM uchun – 20 soniyagacha, boshqalar shu jumladan BMP-1 (BMD-1) uchun – 25 soniyagacha); - agar ko‘rsatilgan nishonlardan bittasi o‘qqa tutilmagan bo‘lsa.", "Barcha javoblar to‘g‘ri."], "c": 1}, {"n": 70, "q": "Qaysi hollarda yo‘q qilingan nishonlar sonidan qat’iy nazar, otish mashg‘uloti “qoniqarsiz” deb baholanadi:", "o": ["- agar jangovar mashinalar qurol-aslahalaridan harakat mobaynida va qisqa to‘xtab otishda otuvchi mashq shartlarida nazarda tutilgan otish uchun sarflanadigan umumiy vaqtdan 10 soniya oshirib otgan bo‘lsa; - agar otuvchi o‘t ochishni to‘xtatish marrasiga chiqqandan keyin o‘q uzgan bo‘lsa.", "- agar harakatdagi otish mashqlarini bajarishda hech bo‘lmaganda bir marotaba to‘xtashni amalga oshirgan bo‘lsa; - agar otuvchi mashqlarni bajarishda quyidagi xavfsizlik choralarini buzgan bo‘lsa; - xavfli yo‘nalishlar chegarasidan tashqariga yoki panagohlarga (qizil bayroq, yoritgich osilgan blindajlarga) o‘t ochgan bo‘lsa; o‘t ochish marrasiga chiqmay turib o‘t ochgan bo‘lsa; otish mashg‘uloti rahbari bilan jangovar mashinalarning ekipajlari o‘rtasida radioaloqa mavjud bo‘lmasa ham o‘t ochishni bajargan bo‘lsa; “Mashq tamom” signali (“O‘t ochishni to‘xtat” komandasi) berilganiga hamda panagohlarda (blindajlarda) oq rangdagi bayroq (yoritgich) ko‘tarilganiga qaramay yoki to‘p (qurol) stvoli qum tepaligiga (to‘siqqa) tushirilgandan keyin ham otishni davom ettirgan bo‘lsa.", "Barcha javoblar to‘g‘ri."], "c": 2}, {"n": 71, "q": "Bo‘linmaga (boshqarmaga, vzvodga, guruhga) otish mashqlarini ijro etganligi uchun qo‘yiladigan baho o‘rganuvchilarning har birining olgan baholarini jamlagan holda chiqariladi va quyidagicha aniqlanadi:", "o": ["“a’lo” – agar, o‘rganuvchilarning kamida 95% ning bahosi ijobiy bo‘lib, bundan kamida 50% o‘rganuvchilar “a’lo” baho olgan bo‘lsa; “yaxshi” – agar, o‘rganuvchilarning kamida 90% ning bahosi ijobiy bo‘lib, bundan kamida 50% o‘rganuvchilar “yaxshi” baho olgan bo‘lsa; “qoniqarli” – agar, o‘rganuvchilarning kamida 85% “qoniqarli”dan past bo‘lmagan baho olgan bo‘lsa.", "“a’lo” – agar, o‘rganuvchilarning kamida 90% ning bahosi ijobiy bo‘lib, bundan kamida 50% o‘rganuvchilar “a’lo” baho olgan bo‘lsa; “yaxshi” – agar, o‘rganuvchilarning kamida 80% ning bahosi ijobiy bo‘lib, bundan kamida 50% o‘rganuvchilar “yaxshi” baho olgan bo‘lsa; “qoniqarli” – agar, o‘rganuvchilarning kamida 70% “qoniqarli”dan past bo‘lmagan baho olgan bo‘lsa.", "“a’lo” – agar, o‘rganuvchilarning kamida 90% ning bahosi ijobiy bo‘lib, bundan kamida 60% o‘rganuvchilar “a’lo” baho olgan bo‘lsa; “yaxshi” – agar, o‘rganuvchilarning kamida 80% ning bahosi ijobiy bo‘lib, bundan kamida 60% o‘rganuvchilar “yaxshi” baho olgan bo‘lsa; “qoniqarli” – agar, o‘rganuvchilarning kamida 70% “qoniqarli”dan past bo‘lmagan baho olgan bo‘lsa."], "c": 1}, {"n": 72, "q": "Jangovar texnikalardan harakat davomida otish vaqtida qisqa to‘xtab otish vaqtlari vaqti ....  (kunduzi va tunda) .", "o": ["kunduzi – 10 soniya, tunda – 12 soniya.", "kunduzi – 12 soniya, tunda – 15 soniya.", "kunduzi – 15 soniya, tunda – 20 soniya."], "c": 0}, {"n": 73, "q": "Har bir o‘quv va nazorat otish mashqi bajarilayotganida paydo bo‘luvchi va harakatchan sun’iy nishonlar ko‘rsatiladigan variantlar sonini belgilang:", "o": ["kunduz kuni uchta, tungi vaqtda ikkita bo‘lishi lozim.", "kunduz kuni uchta, tungi vaqtda uchta bo‘lishi lozim.", "kunduz kuni to‘rtta, tungi vaqtda ikkita bo‘lishi lozim."], "c": 0}, {"n": 74, "q": "Harakat davomida qisqa to‘xtashlarning davomiyligining javobini toping.", "o": ["kunduzi 8 soniyadan, tunda 10 soniyadan oshmasligi kerak.", "kunduzi 7 soniyadan, tunda 10 soniyadan oshmasligi kerak.", "kunduzi ko‘pi bilan 7 soniyadan, tunda 9 soniyadan oshmasligi kerak."], "c": 2}, {"n": 75, "q": "Otish mashg‘uloti oldidan rahbar otuvchi bo‘linma komandiriga qanday vazifa belgilab berishi bo‘yicha to‘g‘ri javobni toping:", "o": ["mo‘ljalni va yo‘nalishlarni ko‘rsatadi, dushman, otuvchi va qo‘shni bo‘linmalarning harakatlari to‘g‘risidagi ma’lumotlarni, tabiiy joydagi o‘t ochish pozitsiyalarining marralari va otishga shay holatga kelish uchun ajratilgan vaqtni belgilaydi.", "mo‘ljalni ko‘rsatadi, dushman, otuvchi va qo‘shni bo‘linmalarning harakatlari to‘g‘risidagi ma’lumotlarni, otishning asosiy va xavfli yo‘nalishlarini aytib o‘tadi, tabiiy joydagi o‘t ochish pozitsiyalarining marralari va otishga shay holatga kelish uchun ajratilgan vaqtni ko‘rsatadi.", "mo‘ljalni ko‘rsatadi, dushmanni bo‘linmalarning harakatlari to‘g‘risidagi ma’lumotlarni, otishning asosiy va xavfli yo‘nalishlarini aytib o‘tadi, o‘t ochish pozitsiyalarning marralari va otishga shay holatga kelish uchun ajratilgan vaqtni belgilaydi."], "c": 1}, {"n": 76, "q": "Ichki ballistika .....", "o": ["o‘qning (granataning) porox gazlari ta’siri tugagandan keyin harakatlarini o‘rganuvchi fan.", "otish paytida hosil bo‘ladigan jarayonlarni, xususan o‘q (granata) ning stvol kanalida harakatlanishini o‘rganuvchi fan.", "o‘qlarning yoyilish qonuni o‘rganuvchi fan."], "c": 1}]}, {"t": "Harbiy topografi rak?", "o": ["+200 C.", "+ 180 C.", "+160 C.", "+250 C."], "c": 1}, {"n": 10, "q": "Boʻlinmalarning xizmat safarlariga kim boshchilik qiladi?", "o": ["Oʻz komandirlari.", "Shtab boshligʻi.", "Komandirning jangovar tayyorgarlik boʻyicha oʻrinbosari.", "Saf boʻlim boshligʻi."], "c": 0}, {"n": 11, "q": "Qurol saqlash xonasidagi pistoletlar, jangovar va oʻquv oʻq-dorilari joylangan javon va yashiklar kimning muxri bilan muxrlanadi?", "o": ["Boʻlinma komandiri.", "Boʻlinma bo‘yicha navbatchi.", "Shtab boshligʻi.", "RAQA xizmati boshligʻi."], "c": 0}, {"n": 12, "q": "Havo oqimini keltiruvchi va so‘rib oluvchi shamollatish qurilmasi qachon ishlatiladi?", "o": ["Havo harorati +300S gradusdan oshganda.", "Harbiy qism komandir belgilagan vaqtlarda.", "Boʻlinma komandirining ruhsati bilan.", "Boʻlinmaning uyquga ketishdan oldin va uygʻongandan soʻng."], "c": 1}, {"n": 13, "q": "Yakkaboshchilik - nima?", "o": ["Yakkaboshchilik – Oʻzbekiston Respublikasi fuqarolarining Qurolli Kuchlar safida harbiy majburiyatini bajarish va harbiy xizmatni oʻtash borasidagi o‘zaro munosabatlarning asosiy tamoyillaridan biri sanaladi.", "Yakkaboshchilik – harbiy burch va shaxsiy masʻuliyatga, sadoqatga, maxsus majburiyatlarni xizmat vaqtida bajarish.", "Yakkaboshchilik – Qurolli Kuchlarning harbiy qo‘rilishi, ularga rahbarlik qilish va harbiy xizmatchilar o‘rtasidagi o‘zaro munosabatlarning asosiy tamoyillaridan biri sanaladi.", "Barcha harbiy xizmatchilar oʻz harbiy unvonlari va lavozimlaridan qaʻtiy nazar qonun olida tengdirlar va huquqiy holatining oʻziga xosliklari hisobga olgan holda ularning zimmasiga Oʻzbekiston Respublikasi fuqoralari uchun belgilangan javobgarlik yuklatiladi."], "c": 2}, {"n": 14, "q": "Qorovulxonalarda avtomatlar uchun qancha miqdorda jangovar patronlar zahirasi tashkil qilinadi?", "o": ["60 ta patron.", "2 ta toʻldirilgan oʻqdon.", "150 ta patron.", "180 ta patron."], "c": 2}, {"n": 15, "q": "Obyektlarni patrullik yoʻli bilan qo‘riqlashni tashkil qilish uchun soqchiga qancha hudud chizig‘i tayinlanadi?", "o": ["Kunduzi- 1000 metrgacha, kechasi - 500 metrgacha.", "Kunduzi-2000 metrgacha, kechasi-1000 metrgacha.", "Kunduzi-1500 metrgacha, kechasi - 700 metrgacha.", "Kunduzi-2000 metrgacha, kechasi - 800 metrgacha."], "c": 0}, {"n": 16, "q": "Ichki tartib nima?", "o": ["Ichki tartib - doimiy janovar shaylik, shaxsiy tarkibga taʻlim berish, harbiy xizmatchilarning sogʻligʻini muhofaza qilish va kundalik faoliyatda harbiy xizmatchilar zimmasiga yuklangan vazifalarning uyushqoqlik bilan bajarilishini taʻminlaydigan shuningdek boʻlinmada harbiy intizomni saqlashga yoʻnaltirilgan texnikaviy va boshqa tadbirlar majmuasi.", "Harbiy xizmatchilarning harbiy qismlar (boʻlinmalar)da joylashishi, kundalik faoliyati, turmushi va sutkalik naryad xizmatini oʻtashning harbiy nizomlarda belgilangan qoidalariga qatʻiy rioya qilishidir.", "Ichki tartib - harbiy xizmatchilarning harbiy qismlarda joylashishi, turmushi va sutkalik naryad xizmatini oʻtashning harbiy nizomlarda belgilangan qoidalariga qatʻiy rioya qilishidir.", "Ichki tartib - harbiy xizmatchilarning harbiy qismda (muassasada, boʻlinmada) joylashishi, kundalik faoliyati, turmushi va sutkalik naryad xizmatini oʻtashning harbiy nizomlarda belgilangan qoidalarga qaʻtiy rioya qilishidir."], "c": 3}, {"n": 17, "q": "Kontrakt boʻyicha harbiy xizmatchilarni xizmat kartochkalari kim tomonidan  yuritiladi?", "o": ["Harbiy qism komandiri tomonidan.", "Boʻlinma komandiri tomonidan.", "Kadr organi tomonidan.", "Harbiy xizmatchi tomonidan."], "c": 2}, {"n": 18, "q": "Harbiy xizmatchiga “Joyingda qadam-bos” komandasi berilganda uning oyogʻi yerdan qancha koʻtariladi?", "o": ["10-15 sm.", "20-25 sm.", "15-20 sm.", "25 sm."], "c": 2}, {"n": 19, "q": "Nima harbiy intizomni mustahkamlash va harbiy xizmatchilarni tarbiyalashning muhim vositasi hisoblanadi?", "o": ["Intizomiy ta’zir.", "Qisqa ta’tilga javob berish.", "Ragʻbatlantirish.", "Qo‘shimcha naryadga tayinlash."], "c": 2}, {"n": 20, "q": "Garnizon naryadi qaydnomasidan koʻchirmalar yangi oy boshlanishiga qancha vaqt qolgunga qadar xizmatni oʻtashga jalb etilgan barcha harbiy qismlarga (muassasalarga) tarqatiladi?", "o": ["3 sutka.", "5 sutka.", "7 sutka.", "10 sutka."], "c": 3}, {"n": 21, "q": "Harbiy intizom nima?", "o": ["Harbiy intizom - bu barcha harbiy xizmatchilarning komandirlar buyruqlari va kun tartibini belgilangan tartib va qoidalarga qatʻiy va aniq rioya etilishidir.", "Harbiy intizom - bu barcha harbiy xizmatchilarning qonunchilik hujjatlari,  harbiy Nizomlar va komandirlar (boshliqlar) buyruqlari bilan belgilangan tartib va qoidalarga qatʻiy hamda aniq rioya etilishidir.", "Harbiy intizom - bu barcha harbiy xizmatchilarning MV va QK BShB buyruqlari bilan belgilangan tartib va qoidalarga qatʻiy va aniq rioya etilishidir.", "Harbiy intizom - bu barcha harbiy xizmatchilarning komandirlar (boshliqlar) buyruqlari belgilangan joylashish qoidalariga aniq rioya etilishidir."], "c": 1}, {"n": 22, "q": "Ovqat tanovullari oʻrtasidagi oraliq necha soatdan oshmasligi kerak?", "o": ["8.", "6.", "7. E) 5."], "c": 2}, {"n": 23, "q": "Nima uchun harbiy xizmatchilar intizomiy javobgarlikka tortiladilar?", "o": ["Harbiy xizmatchilar intizomiy nojoʻya xatti-harakatlari yoki maʻmuriy huquqbuzarliklar sodir etkanliklari uchun Qurolli Kuchlarning intizom nizomida belgilangan tartibda intizomiy javobgarlikka tortiladilar.", "Harbiy xizmatchilar yoʻl harakati qoidalarini, ov qilish, baliq ovlash va bojxona qoidalarini buzganliklari uchun intizomiy javobgarlikka tortiladilar.", "Harbiy xizmatchilar Jinoyat kodeksini buzganliklari uchun intizomiy javobgarlikka tortiladilar.", "Harbiy xizmatchilar Davlatga yetkazgan moddiy zararlari uchun intizomiy javobgarlikka tortiladilar."], "c": 0}, {"n": 24, "q": "Navbatchi bo‘linma nima uchun tayinlanadi?", "o": ["Navbatchi bo‘linma qorovullarni kuchaytirish yoki yong‘in, tabbiy ofat yoxud ko‘ngilsiz hodisa paytlarida zudlik bilan chaqirilishi uchun tayinlanadi.", "Navbatchi bo‘linma qorovullarni kuchaytirish yoki yong‘in, tabbiy ofat paytlarida zudlik bilan chaqirilishi uchun tayinlanadi.", "Navbatchi bo‘linma qorovullarni kuchaytirish uchun tayinlanadi.", "Navbatchi bo‘linma qorovullarni kuchaytirish yoki yong‘in, harbiy qismni o‘zboshimchalik bilan tashlab ketmoqchi bo‘lganlarni ushlash, tabbiy ofat yoxud ko‘ngilsiz hodisa paytlarida zudlik bilan chaqirilishi uchun tayinlanadi."], "c": 0}, {"n": 25, "q": "Intizomiy amaliyot toʻgʻri qoʻllanilayotganligi tekshirish maqsadida komandir (boshliq) qancha muddatda xizmat kartochkalarini koʻrib chiqish kerak?", "o": ["Har oyda.", "Har olti oyda.", "Har chorakda.", "Har yilda."], "c": 2}, {"n": 26, "q": "Harbiy xizmatchilarga nisbattan intizomiy taʻzir nima uchun qo‘llaniladi?", "o": ["Nojoʻya xatti-harakati uchun.", "Qoʻyilgan vazifani bajarmaganligi uchun.", "Safga kech qolganligi uchun.", "Jinoyat sodir etganligi uchun."], "c": 0}, {"n": 27, "q": "Naryadga tushadigan kun sutkalik naryadlarning tayyorgarligi uchun qancha vaqt beriladi?", "o": ["Kun tartibida belgilangan soatlarda kamida 1 soat.", "Kun tartibida belgilangan soatlarda kamida 4 soat.", "Kun tartibida belgilangan soatlarda kamida 2 soat.", "Kun tartibida belgilangan soatlarda kamida 3 soat."], "c": 3}, {"n": 28, "q": "Harbiycha salomlashish nimani belgisi sanaladi?", "o": ["Harbiycha salom berish harbiy xizmatchilarni oʻzaro hurmat belgisi sanaladi.", "Harbiycha salomlashish harbiy xizmatchilarni jibsligining ifodasi, oʻzaro hurmat madaniyatini barpo etish belgisi sanaladi.", "Harbiycha salom berish amali harbiy xizmatchilarning birodarcha jipsligining ifodasi, oʻzaro hurmat va mushtarak madaniyatning namoyon boʻlishi belgisi sanaladi.", "Harbiycha salomlashish harbiy xizmatchilarni oʻzaro hurmat madaniyatini namoyon boʻlishi belgisi sanaladi."], "c": 2}, {"n": 29, "q": "Qorovullar postni sutka davomida qoʻriqlash uchun necha smenali soqchilar tayinlanadi?", "o": ["Ikki smenali soqchilar.", "Uch smenali soqchilar.", "Komandir beligilaydi.", "Qorovul boshligʻi belgilaydi."], "c": 1}, {"n": 30, "q": "Harbiy xizmatchilar sogʻligʻining holati ustidan tibbiy nazorat qayday tadbirlarni o‘tkazish bilan amalga oshiriladi?", "o": ["Har kuni jangovar (maxsus) tayyorgarlik jarayonida va kundalik hayyotda shaxsiy tarkibning tibbiy kuzatuvi.", "Harbiy xizmatchilarning tibbiy koʻriklari.", "Harbiy xizmatchilar sogʻligʻini chuqurlashtirilgan va nazorat tariqasidagi tekshiruvi.", "barcha javoblar toʻgʻri."], "c": 3}, {"n": 31, "q": "Qachon soqchilar har 1 soatda almashtiriladi?", "o": ["Havo harorati -200 C va undan ham past yoki +300 C (soyada) dan baland boʻlgan holda.", "Havo harorati -150 C va undan ham past yoki +350 C (soyada) dan baland boʻlgan holda.", "Havo harorati -50 C va undan ham past yoki +300 C (soyada) dan baland boʻlgan holda.", "Havo harorati -100 C va undan ham past yoki +400 C (soyada) dan baland boʻlgan holda."], "c": 0}, {"n": 32, "q": "Yilning qish faslida qorovulxona bir kecha-kunduzda necha marta shamollatiladi?", "o": ["kamida 2 marta.", "kamida 4 marta.", "kamida 3 marta.", "kamida 1 marta."], "c": 1}, {"n": 33, "q": "Qishda qorovulxonadagi harorat qancha boʻlishi kerak?", "o": ["+160 C darajadan past bo‘lmasligi kerak.", "+200 C darajadan past bo‘lmasligi kerak.", "+180 C darajadan past bo‘lmasligi kerak.", "Harbiy qism komandiri tomonidan belgilanadi."], "c": 2}, {"n": 34, "q": "Qancha muddatda tibbiyot xizmati mutaxassislarini jalb qilgan holda qorovulxonada proflaktik dezinfiksiya ishlari oʻtkaziladi?", "o": ["Haftada ikki marta.", "Haftada bir marta.", "Ikki haftada bir marta.", "Har kuni."], "c": 1}, {"n": 35, "q": "Post soyabon balanligi qancha bo‘lishi kerak?", "o": ["2,5 m.", "3 m.", "2,2 m.", "1,8 m."], "c": 2}, {"n": 36, "q": "Soqchining kuzatuv minorasi balanligi?", "o": ["9 m.", "8,5 m.", "4,6 m.", "9,5 m."], "c": 3}, {"n": 37, "q": "Naryadga tushadigan kun qorovul shaxsiy tarkibiga xizmatni o‘tashga tayyorgarlik ko‘rish uchun qancha vaqt beriladi?", "o": ["Kamida 5 soat.", "Kamida 1 soat.", "Kamida 2 soat.", "Kamida 3 soat."], "c": 3}, {"n": 38, "q": " Tashqariga chiqaruvchilar gauptvaxtadagi umumiy joy miqdori va saqlanayotgan harbiy xizmatchilarning soniga qarab bitta tashqariga chiqaruvchiga necha nafar ushlab turilgan harbiy xizmatchi va qamoqqa olish tarzidagi ehtiyot chorasi qoʻllangan harbiy xizmatchilar toʻgʻri kelishi hisobi bilan tayinlanadi?", "o": ["7-10 nafar.", "10-15 nafar.", "10-12 nafar.", "10-20 nafar."], "c": 1}, {"n": 39, "q": "Ertalabki koʻrikda nimalar tekshiriladi?", "o": ["Shaxsiy tarkibning soniga aniqlik kiritiladi, ularning tashqi ko‘rinishi va shaxsiy gigiyena qoidalariga amal qilishlari.", "Shaxsiy tarkibning soniga aniqlik kiritiladi va tashqi ko‘rinishi.", "Shaxsiy tarkibning soni, ularning kiyim-boshi va qurol-yarogʻi.", "Shaxsiy tarkibning shaxsiy gigiyena qoidalariga rioya qilishi va qurol-yarogʻini soni."], "c": 0}, {"n": 40, "q": "Harbiy xizmatchilarni chiniqtirish bo‘yicha tadbirlar kimlarning nazoratida o‘tkaziladi?", "o": ["Komandir (boshliq)lari.", "Tibbiyyot xizmati boshligʻi.", "Jiismoniy tayyorgarlik va sport boshligʻi.", "Barchasi toʻgʻri."], "c": 3}, {"n": 41, "q": "Saf deb nimaga aytiladi?", "o": ["Harbiy xizmatchilar, boʻlinma va harbiy qismlarning piyoda hamda mashinalarda birgalikda yurishi uchun mazkur Nizomda belgilangan tartibda joylashuvi.", "Harbiy xizmatchilar, boʻlinma va harbiy qismlarning safda yonma-yon turgan harbiy xizmatchilar (mashinalar), boʻlinmalar va qismlar oʻrtasidagi bir chiziqga joylashuvi.", "Harbiy xizmatchilar, boʻlinmalar bir chiziqda, belgilangan interval saqlagan holda joylashuvi.", "Harbiy xizmatchilar, boʻlinmalar, mashinalar harakatlanishi uchun bir chiziqda, belgilangan interval masofani olgan holda joylashuvi."], "c": 0}, {"n": 42, "q": "Interval deb nimaga aytiladi?", "o": ["Qanotlar oʻrtasidagi masofa.", "Safda yonma-yon turgan harbiy xizmatchilar (mashinalar), boʻlinma va qismlar oʻrtasidagi oraliq masofa.", "Front boʻylab harbiy xizmatchi (mashina)lar boʻlinma va harbiy qismlar orasidagi masofa.", "Harbiy xizmatchilarning Nizomga koʻra piyoda harakat qilish uchun joylashuvi."], "c": 2}, {"n": 43, "q": "Qanot deb nimaga aytiladi?", "o": ["Safda yonma-yon turgan harbiy xizmatchilar oʻrtasidagi oraliq masofa.", "Harbiy xizmatchilarning Nizomga koʻra piyoda harakat qilish uchun joylashuvi.", "Safning oʻng (chap) tomoni. Saf burilganda, qanotlar nomi oʻzgarmaydi.", "Qanotlar oʻrtasidagi masofa."], "c": 2}, {"n": 44, "q": "Sherenga deb nimaga aytiladi?", "o": ["Safda yonma-yon turgan harbiy xizmatchilar oʻrtasidagi oraliq masofa.", "Qanotlar oʻrtasidagi masofa.", "Safda oldinma-keyin turgan harbiy xizmatchilar (mashinalar), boʻlinmalar va qismlar oʻrtasidagi oraliq masofa.", "Harbiy xizmatchilarning bir chiziqda, belgilangan intervalni saqlagan holda yonma-yon turgan saf."], "c": 3}, {"n": 45, "q": "Distansiya deb nimaga aytiladi?", "o": ["Qanotlar oʻrtasidagi masofa.", "Saf uzunligi boʻylab harbiy xizmatchi (mashina)lar, boʻlinma va harbiy qismlar orasidagi masofa.", "Safning oʻng (chap) chekkasi. Saf bir tomondan ikkinchi tomonga burilgan vaqtda qanotlar nomi oʻzgarmaydi.", "Safda oldinma-keyin turgan harbiy xizmatchilar (mashinalar), boʻlinmalar va qismlar oʻrtasidagi oraliq masofa."], "c": 1}, {"n": 46, "q": "Texnik qoʻriqlash vositalari nima maqsadda qoʻllaniladi?", "o": ["Obyektlar qorovullarini shaxsiy tarkibi soni kamaytirish va ichki xavfsizligi taʻminlash.", "Obyektlar himoyasi mustahkamligini oshirish.", "Obyektlar himoyasi mustahkamligini oshirish va qorovullar shaxsiy tarkibi sonini kamaytirish maqsadida.", "Obyektlar himoyasi mustahkamligini oshirish hamda soqchilar xushyorligini oshirish maqsadida."], "c": 2}, {"n": 47, "q": "Sutkalik naryadlar qachon xizmatini oʻtashga tayyor boʻlishi hamda oʻz navbatchilari va qorovul boshligʻi tomonidan boʻysunuviga olinishi lozim?", "o": ["Sutkalik naryadga tayinlangan vaqtda.", "Tarqatuv vaqtida qism bo‘ycha navbatchga qorovul boshlig‘i bildiruv berganda.", "Tarqatuvga 15 daqiqa qolganda", "Amaliy mashg‘ulotlar boshlangan vaqtda."], "c": 2}, {"n": 48, "q": "Intizomiy nojoʻya xatti-harakatni sodir etgan harbiy xizmatchiga nisbatan intizomiy taʼzirning berilishi xizmat tekshiruvi yoki tergovga qadar tekshiruv tugagan, shuningdek, yigʻilish yoki attestatsiya komissiyasining qarori qabul qilingan kundan boshlab qancha vaqtdan kechiktirmay qoʻllaniladi?", "o": ["10 kun", "20 kun", "30 kun", "15 kun"], "c": 0}, {"n": 49, "q": "Komandir va generallarning xizmat kartochkalari qayerda yuritiladi?", "o": ["Birlashma shtabida", "Bo‘linma kadr organida", "Yuqori turuvchi shtabda", "Okruglar shtabida"], "c": 2}, {"n": 50, "q": "Oʻzbekiston Respublikasi hududida garnizon xizmatiga kim rahbarlik qiladi?", "o": ["Okrug qo‘mondoni", "Mudofaa vaziri", "Mudofaa vaziri tayinlagan mansabdor shaxs", "Mudofaa vazirining o‘rinbosarlaridan biri."], "c": 1}, {"n": 51, "q": "Garnizon navbatchi boʻlinmasi kimlarga bo‘ysunadi?", "o": ["Faqat garnizon boshligʻiga", "Garnizon harbiy komendanti", "Garnizon boshligʻi, garnizon harbiy komendanti, va garnizon boʻyicha navbatchi hamda bo‘linma komandiriga.", "Garnizon boshligʻi, garnizon harbiy komendanti va garnizon boʻyicha navbatchiga boʻysunadi."], "c": 3}, {"n": 52, "q": "Sutkaga tayinlangan garnizon patruli qanday xizmatni oʻtaydi?", "o": ["2 soat xizmat va garnizon harbiy komendaturasida ikki soat dam olish bilan", "6 soat xizmat va garnizon harbiy komendaturasida ikki soat dam olish bilan", "8 soat xizmat va garnizon harbiy komendaturasida ikki soat dam olish bilan", "4 soat xizmat va garnizon harbiy komendaturasida ikki soat dam olish bilan."], "c": 3}, {"n": 53, "q": "Belgilangan qoidalarni buzgani uchun ushlangan harbiy xizmatchilar bilan harbiy komendaturada qanday mashgʻulotlar oʻtkaziladi?", "o": ["Harbiy komendaturada kunduz kunlari 2 soatgacha (1 soat – safda yurish mashqlari va 1 soat – harbiy nizomlarni oʻrganish boʻyicha) mashgʻulotlar oʻtkaziladi.", "Harbiy komendaturada kunduz kunlari 4 soatgacha (2 soat – safda yurish mashqlari va 2 soat – harbiy nizomlarni oʻrganish boʻyicha) mashgʻulotlar oʻtkaziladi.", "Harbiy komendaturada kunduz kunlari 6 soatgacha (3 soat – safda yurish mashqlari va 3 soat – harbiy nizomlarni oʻrganish boʻyicha) mashgʻulotlar oʻtkaziladi.", "Harbiy komendaturada kunduz kunlari 2 soatgacha mashgʻulotlar oʻtkaziladi yoki 3 sutkagacha gauptvaxtaga bandi qilinadi."], "c": 0}, {"n": 54, "q": "Parad uchun avtomat bilan qurollangan harbiy qismlar (muassasalar) avtomatni qanday holatida tutgan holda saflanadi?", "o": ["Avtomatni “ko‘krakka” holatida.", "Qurol “orqaga” holatida.", "Qurol “tasmaga” holatida.", "Parad o‘tkazayotgan komandir belgilaydi."], "c": 0}, {"n": 55, "q": "Faxriy qorovullar soqchilari va bayroqdorlar necha daqiqadan soʻng almashtiriladi?", "o": ["10 daqiqada", "20 daqiqada", "15 daqiqada.", "30 daqiqada."], "c": 2}, {"n": 56, "q": "QTV bilan jihozlangan obyektlarni patrullik yoʻli bilan qo‘riqlashni tashkil qilishda soqchiga qancha hudud chizig‘i tayinlanadi?", "o": ["Kunduzi- 1000 metrgacha, kechasi - 500 metrgacha.", "Kunduzi-2500 m, kechasi-1500 m.", "Kunduzi-1500 metrgacha, kechasi - 1000 metrgacha.", "Kunduzi-2000 metrgacha, kechasi - 1000 metrgacha."], "c": 3}, {"n": 57, "q": "Bevosita komandir (boshliq) deganda nimani tushinasiz?", "o": ["Xizmat boʻyicha boʻysunuvchiga eng yaqin boʻlgan toʻgʻridan-toʻgʻri komandir (boshliq).", "Xizmat boʻyicha boʻysunuvchiga eng yuqori boʻlgan komandir (boshliq).", "Xizmat boʻyicha boʻysunuvchidan harbiy unvoni yuqori boʻlgan komandir (boshliq).", "Xizmat boʻyicha boʻysunuvchidan lavozimi yuqori boʻlgan komandirlar (boshliqlar)."], "c": 0}, {"n": 58, "q": "Harbiy xizmatchi komandirga (boshliqqa) yoki kattaga harbiy unvonini aytmagan holda nima deb murojaat etishga ruxsat beriladi?", "o": ["“Hurmatli polkovnik”", "“Polkovnigim”", "“Komandirim”", "“Sardorim”"], "c": 3}, {"n": 59, "q": "Bino xonalari (uxlash xonalari) posbonlar tomonidan boʻlinma boʻyicha navbatchi kuzatuvi ostida qaysi vaqtlarda shamollatiladi?", "o": ["Shaxsiy tarkib uyqudan turganidan soʻng.", "Shaxsiy tarkib uyquga yotishidan oldin va uyqudan turganidan soʻng.", "Shaxsiy tarkib uyquga yotishidan oldin va doimiy tarzda bir dona kichik deraza ochiq bo‘ladi.", "Bo‘linma komandiri belgilagan vaqtlarda."], "c": 1}, {"n": 60, "q": "Shaxdam qadam tashlab yurganda oyoq yerdan qancha ko‘tariladi?", "o": ["15-20 sm", "20-25 sm", "10-15 sm", "15-25 sm."], "c": 0}, {"n": 61, "q": "Shtat boʻyicha yongʻin oʻchirish komandasiga ega boʻlmagan harbiy qismda (muassasada) tarkibi necha kishidan iborat shtatdan tashqari yongʻin oʻchirish komandasi tuziladi?", "o": ["5 kishidan 10 kishigacha", "5 kishidan 15 kishigacha", "10 kishidan 15 kishigacha", "7 kishidan 15 kishigacha."], "c": 1}, {"n": 62, "q": "Tushlikdan soʻng qancha vaqt mobaynida amaliy mashgʻulotlar yoki xoʻjalik ishlari oʻtkazilmasligi lozim?", "o": ["1 soat", "40 daqiqa", "30 daqiqa", "2 soat."], "c": 2}, {"n": 63, "q": "Oʻz xizmat majburiyatlarini bajarishdan (mashgʻulotlar, ishlardan) qisman yoxud toʻliq ozod qilish uchun xulosa qancha muddatga beriladi?", "o": ["Ko‘pi bilan 7 sutkaga", "Ko‘pi bilan 10 sutkaga", "Koʻpi bilan 3 sutkaga", "Komandir belgilaydi"], "c": 2}, {"n": 64, "q": "Harbiy qism (muassasa) tibbiyot punkti lazaretida qancha vaqtgacha yotib davolanadigan bemorlar davolanadi?", "o": ["7 kungacha.", "14 kungacha.", "10 kungacha.", "15 kungacha."], "c": 1}, {"n": 65, "q": "Seksiya komandiridan vzvod komandirigacha boʻlgan komandirlar hamda ularga tenglashtirilganlar qanday intizomiy ta’zir qo‘llash huquqlarga ega?", "o": ["Hayfsan eʼlon qilish; harbiy qism (muassasa) hududidan navbatdagi javob (ruxsat) berishdan mahrum qilish.", "Hayfsan eʼlon qilish.", "Hayfsan; qattiq hayfsan.", "Barcha javoblar to‘g‘ri."], "c": 0}, {"n": 66, "q": "Yodgorlik (qabr) oldiga tizilgan faxriy qorovul qancha vaqtdan navbat almashgan holda xizmat oʻtaydi?", "o": ["1 soat", "2 soat", "20 daqiqa", "30 daqiqada."], "c": 3}, {"n": 67, "q": "Garnizon qorovullarini tarqatuv joyigacha va tarqatuv joyidan qorovulxonagacha bo‘lgan harakat vaqti qanchadan oshmasligi kerak?", "o": ["1 soat 20 daqiqadan oshmasligi kerak.", "1 soat daqiqadan oshmasligi kerak.", "2 soat daqiqadan oshmasligi kerak.", "1 soat 40 daqiqadan oshmasligi kerak."], "c": 1}, {"n": 68, "q": "Qorovulxona kirish eshigi oldidagi soqchi qancha vaqtda almashtiriladi?", "o": ["30 daqiqa", "1 soat", "2 soat", "40 daqiqa"], "c": 0}, {"n": 69, "q": "Qachon qorovul soqchi (soqchi qorovul) holatiga o‘tadi?", "o": ["Postni qabul qilgani (topshirgani) haqidagi bildiruv bilan.", "Tarqatuvchining postga (postdan) qadam bos komandasi bilan.", "Tarqatuvchining smena ortimdan qadam bos komandasi bilan.", "Qorovul boshlig‘ining komandasi bilan."], "c": 0}, {"n": 70, "q": "Nazorat-qoʻriqlash guruhi qorovullariga – navbat bilan qorovul boshligʻining ruxsati bilan dam olishga qancha vaqt beriladi?", "o": ["2 soat", "4 soat", "3 soat", "1 soat."], "c": 1}, {"n": 71, "q": "Gauptvaxtada saqlanayotgan bandilar xonasida havo harorati qancha bo‘lishi kerak?", "o": ["16°C", "20°C", "18°C", "19°C."], "c": 2}, {"n": 72, "q": "Har bir gauptvaxtada harbiy xizmatchilar sayr qilishi uchun hovli balandligi qancha bo‘lgan devor bilan oʻralgan boʻlishi kerak?", "o": ["3 metrdan kam bo‘lmagan.", "1,8 metrdan kam bo‘lmagan.", "2,5 metrdan kam bo‘lmagan.", "2 metrdan kam bo‘lmagan."], "c": 3}, {"n": 73, "q": "Harbiy shaharcha va obyektlarni qo‘riqlash va mudofaa qilish rejalariga qachon aniqliklar kiritiladi.", "o": ["Har kuni, harbiy qism bo‘yicha tezkor navbatchi tomonidan navbatchilikni qabul qilishda.", "Har oy, jangovar safarbarlik hujjatlari ko‘rib chiqilayotganda.", "Har kuni, shtab boshlig‘ining harbiy xizmat xavfsizligini ta’minlash bo‘yicha o‘rinbosari tomonidan.", "Har xafta, shtab boshlig‘ining harbiy xizmat xavfsizligini ta’minlash bo‘yicha o‘rinbosari tomonidan."], "c": 1}, {"n": 74, "q": "Bino va inshootlarning belgilanishi, muhimlik ahamiyati hamda ularn
